<!DOCTYPE html>
<html lang="en" class="page">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI</title>
    <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="paroxysm.css">
    <link rel="icon" href="assets/paroxysm/paroxysm_darkmode_favicon.ico" sizes="any">
    <script src="paroxysm.config.js"></script>
    <script src="paroxysm-settings.js"></script>
    <script src="paroxysm-rise.js"></script>
    <script src="paroxysm-ai.js"></script>
    <script src="paroxysm-ai-settings.js"></script>
    <style>
        textarea { font: inherit; }
        body.ai { display: grid; grid-template-columns: 272px minmax(0, 1fr); height: 100vh; overflow: hidden; background: var(--surface); transition: grid-template-columns .2s var(--ease); }
        body.ai.sb-hidden { grid-template-columns: 0 minmax(0, 1fr); }

        /* sidebar */
        .sb { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; padding: var(--s3); background: var(--bg); overflow: hidden; }
        .sb-hidden .sb { visibility: hidden; }
        .sb-top { display: flex; align-items: center; justify-content: space-between; padding: var(--s1) var(--s1) var(--s1) var(--s3); }
        .sb-brand { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
        .sb-brand b { color: var(--accent); font-weight: 600; }
        .round-btn { display: grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: 50%; color: var(--text-2); transition: background .12s var(--ease), color .12s var(--ease); }
        .round-btn:hover:not(:disabled) { background: var(--surface-3); color: var(--text); }
        .round-btn .icon { width: 17px; height: 17px; }
        .sb-new { display: flex; align-items: center; gap: var(--s3); height: 38px; padding: 0 var(--s3); border-radius: var(--pill); color: var(--text); font-size: 13px; font-weight: 500; transition: background .12s var(--ease); }
        .sb-new:hover { background: var(--accent-soft); }
        .sb-new .icon, .sb-search .icon { width: 16px; height: 16px; }
        .sb-search { display: flex; align-items: center; gap: var(--s2); height: 38px; padding: 0 var(--s3); background: var(--surface-2); border-radius: var(--pill); color: var(--text-3); }
        .sb-search input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: 0; color: var(--text); font-size: 13px; }
        .sb-search input::placeholder { color: var(--text-3); }
        .sb-list { flex: 1; min-height: 0; overflow-y: auto; margin: 0 calc(var(--s1) * -1); padding: 0 var(--s1); }
        .grp { padding: var(--s4) var(--s3) var(--s1); color: var(--text-3); font-size: 11.5px; font-weight: 500; }
        .chat { position: relative; display: flex; align-items: center; gap: var(--s2); height: 36px; padding: 0 var(--s3); border-radius: var(--pill); color: var(--text-2); font-size: 13px; font-weight: 500; cursor: pointer; transition: background .12s var(--ease), color .12s var(--ease); }
        .chat > .icon { width: 15px; height: 15px; opacity: .7; }
        .chat .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chat:hover { background: var(--accent-soft); color: var(--text); }
        .chat.on { background: var(--surface-3); color: var(--text); }
        .chat .acts { display: none; gap: 2px; margin-right: -6px; }
        .chat:hover .acts, .chat:focus-within .acts { display: flex; }
        .chat:hover > .pin-mark, .chat:focus-within > .pin-mark { display: none; }
        .acts button { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; color: var(--text-3); }
        .acts button:hover { background: var(--surface-3); color: var(--text); }
        .acts .icon { width: 13px; height: 13px; }
        .none { padding: var(--s5) var(--s3); color: var(--text-3); font-size: 12.5px; }

        .usage { padding: var(--s3) var(--s4); background: var(--surface-2); border-radius: 18px; color: var(--text-2); font-size: 12px; }
        .u-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--s2); color: var(--text); font-weight: 600; }
        .u-top span { display: inline-flex; align-items: center; gap: 6px; }
        .u-top .icon { width: 14px; height: 14px; }
        .badge { padding: 2px 7px; border-radius: var(--pill); background: var(--surface-3); color: var(--text-2); font-size: 10px; font-weight: 600; letter-spacing: .04em; }
        .bar { height: 4px; border-radius: 4px; background: var(--surface-3); overflow: hidden; margin-bottom: var(--s2); }
        .bar i { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--accent); transition: width .3s var(--ease); }
        .u-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px var(--s3); }
        .u-grid span:nth-child(even) { text-align: right; }
        .u-reset { margin-top: var(--s2); color: var(--text-3); font-size: 11px; }
        .u-foot { margin-top: var(--s3); }
        .u-foot button { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 32px; border-radius: var(--pill); background: var(--surface-3); color: var(--text-2); font-size: 12px; font-weight: 500; transition: background .12s var(--ease), color .12s var(--ease); }
        .u-foot button:hover { background: var(--accent-soft); color: var(--text); }
        .u-foot .icon { width: 14px; height: 14px; }

        /* main */
        .main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
        .m-head { display: flex; align-items: center; gap: var(--s3); height: 52px; padding: 0 var(--s4) 0 var(--s5); flex: none; }
        .m-head h1 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 600; cursor: text; }
        .sb-open { display: none; margin-left: calc(var(--s3) * -1); }
        .sb-hidden .sb-open { display: grid; }
        .model-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 var(--s3) 0 var(--s4); border-radius: var(--pill); background: var(--surface-2); color: var(--text-2); font-size: 12.5px; font-weight: 500; transition: background .12s var(--ease), color .12s var(--ease); }
        .model-btn:hover { background: var(--surface-3); color: var(--text); }
        .model-btn .icon { width: 14px; height: 14px; }
        .scroll { flex: 1; min-height: 0; overflow-y: auto; }
        .thread { display: flex; flex-direction: column; gap: 24px; max-width: 760px; min-height: 100%; margin: 0 auto; padding: var(--s4) var(--s5) var(--s6); }
        .jump { position: absolute; left: 50%; bottom: 100px; translate: -50% 0; z-index: 3; display: none; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--surface-3); box-shadow: var(--shadow); color: var(--text); }
        .jump.show { display: grid; }

        /* empty state */
        .hero { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s5); flex: 1; padding: var(--s6) 0 var(--s7); text-align: center; }
        .hero h2 { max-width: 420px; font-size: 30px; font-weight: 700; letter-spacing: -.03em; line-height: 1.15; }
        .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--s2); max-width: 560px; }
        .chip { display: inline-flex; align-items: center; gap: var(--s2); height: 38px; padding: 0 var(--s4); border-radius: var(--pill); background: var(--surface-2); color: var(--text-2); font-size: 13px; font-weight: 500; transition: background .12s var(--ease), color .12s var(--ease); }
        .chip:hover { background: var(--accent-soft); color: var(--text); }
        .chip .icon { width: 15px; height: 15px; }
        .src-note { max-width: 440px; color: var(--text-3); font-size: 12.5px; line-height: 1.6; }
        .src-note button { color: var(--accent-2); font-weight: 500; }
        .src-note button:hover { text-decoration: underline; }

        /* messages */
        .msg { min-width: 0; }
        .msg.user { align-self: flex-end; display: flex; flex-direction: column; align-items: flex-end; gap: var(--s2); max-width: 82%; }
        .bubble { padding: 10px 16px; border-radius: 20px; background: var(--surface-2); white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
        .pics { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--s2); }
        .pics img { display: block; max-width: 180px; max-height: 160px; border-radius: 14px; object-fit: cover; }
        .msg.user .acts { display: flex; opacity: 0; transition: opacity .12s var(--ease); }
        .msg.user:hover .acts, .msg.user:focus-within .acts { opacity: 1; }
        .msg.ai { align-self: stretch; }
        .note { display: inline-flex; align-items: center; gap: var(--s2); margin-bottom: var(--s3); padding: 6px 12px; border-radius: var(--pill); background: var(--surface-2); color: var(--text-2); font-size: 12px; }
        .thought { margin-bottom: var(--s3); }
        .thought summary { display: inline-flex; align-items: center; gap: 6px; list-style: none; cursor: pointer; color: var(--text-3); font-size: 12.5px; font-weight: 500; }
        .thought summary::-webkit-details-marker { display: none; }
        .thought summary:hover { color: var(--text-2); }
        .thought summary .icon { width: 14px; height: 14px; }
        .thought summary .icon:last-child { transition: rotate .15s var(--ease); }
        .thought[open] summary .icon:last-child { rotate: 180deg; }
        .thought.live summary { animation: pulse 1.4s ease-in-out infinite; }
        @keyframes pulse { 50% { opacity: .45; } }
        .t-body { margin-top: var(--s2); padding-left: var(--s4); border-left: 2px solid var(--surface-3); color: var(--text-3); font-size: 13px; max-height: 280px; overflow-y: auto; }
        .dots { display: inline-flex; gap: 5px; padding: 8px 0; }
        .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); animation: dot 1.1s ease-in-out infinite; }
        .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
        @keyframes dot { 0%, 80%, 100% { opacity: .3; scale: .8; } 40% { opacity: 1; scale: 1; } }
        .msg.ai .acts { display: flex; align-items: center; gap: 2px; margin-top: var(--s2); margin-left: calc(var(--s2) * -1); }
        .acts .a-btn { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; color: var(--text-3); transition: background .12s var(--ease), color .12s var(--ease); }
        .acts .a-btn:hover { background: var(--surface-3); color: var(--text); }
        .acts .a-btn .icon { width: 15px; height: 15px; }
        .by { margin-left: var(--s2); color: var(--text-3); font-size: 11.5px; }
        .err-card { display: flex; flex-direction: column; align-items: flex-start; gap: var(--s3); padding: var(--s4) var(--s5); border-radius: 18px; background: color-mix(in srgb, var(--err) 12%, var(--surface-2)); color: var(--text-2); font-size: 13px; line-height: 1.55; }
        .err-card .row-btns { display: flex; flex-wrap: wrap; gap: var(--s2); }
        .err-card .btn { height: 32px; padding: 0 var(--s4); font-size: 12.5px; }

        /* markdown */
        .md { line-height: 1.7; overflow-wrap: anywhere; }
        .md > *:first-child { margin-top: 0; } .md > *:last-child { margin-bottom: 0; }
        .md p { margin: 0 0 var(--s3); }
        .md h2, .md h3, .md h4, .md h5 { margin: var(--s5) 0 var(--s2); font-weight: 600; letter-spacing: -.01em; line-height: 1.3; }
        .md h2 { font-size: 20px; } .md h3 { font-size: 17px; } .md h4, .md h5 { font-size: 15px; }
        .md ul, .md ol { margin: 0 0 var(--s3); padding-left: 22px; }
        .md li { margin: 3px 0; } .md li > ul, .md li > ol { margin: 3px 0 0; }
        .md a { color: var(--accent-2); text-decoration: underline; text-underline-offset: 2px; }
        .md code { padding: 1px 6px; border-radius: 6px; background: var(--surface-2); font: 500 .88em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
        .md blockquote { margin: 0 0 var(--s3); padding-left: var(--s4); border-left: 3px solid var(--surface-3); color: var(--text-2); }
        .md hr { margin: var(--s4) 0; border: 0; height: 1px; background: var(--surface-3); }
        .md .tbl { margin: 0 0 var(--s3); overflow-x: auto; }
        .md table { border-collapse: collapse; font-size: 13px; }
        .md th, .md td { padding: 6px 12px; border-bottom: 1px solid var(--surface-3); text-align: left; }
        .md th { color: var(--text); font-weight: 600; }
        .code { margin: 0 0 var(--s3); border-radius: 16px; background: var(--bg); overflow: hidden; }
        .code-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 6px var(--s4); background: var(--surface-2); color: var(--text-3); font-size: 12px; }
        .code-copy { height: 26px; padding: 0 var(--s3); border-radius: var(--pill); color: var(--text-2); font-size: 12px; font-weight: 500; }
        .code-copy:hover { background: var(--surface-3); color: var(--text); }
        .code pre { margin: 0; padding: var(--s3) var(--s4); overflow-x: auto; }
        .code pre code { padding: 0; background: none; font: 400 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }
        .tk-c { color: var(--text-3); font-style: italic; } .tk-s { color: #8fd18f; } .tk-n { color: #e5a46a; } .tk-k { color: var(--accent-2); }
        html[data-theme="light"] .tk-s { color: #2c8a3d; } html[data-theme="light"] .tk-n { color: #b8641a; }

        /* equations (MathML from paroxysm-ai.js) */
        math { font-family: "Cambria Math", "STIX Two Math", "Latin Modern Math", math; font-size: 1.14em; }
        .mathbox { margin: 0 0 var(--s3); padding: 4px 0; overflow-x: auto; text-align: center; }
        .mathbox math { display: block math; }
        math mtd { padding: .15em .35em; }
        math .m-aligned mtd:nth-child(odd) { text-align: right; }
        math .m-aligned mtd:nth-child(even), math .m-cases mtd { text-align: left; }
        .math-raw { white-space: pre-wrap; }

        /* composer */
        .dock { flex: none; width: 100%; max-width: 800px; margin: 0 auto; padding: 0 var(--s5) var(--s3); }
        .composer { display: flex; flex-direction: column; gap: var(--s2); padding: 10px 10px 10px 18px; border-radius: 26px; background: var(--surface-2); transition: box-shadow .12s var(--ease), padding .15s var(--ease), border-radius .15s var(--ease); }
        /* with nothing typed it is as tall as the sidebar's search bar (38 px) */
        .composer.compact { padding: 1px 1px 1px 18px; border-radius: var(--pill); }
        .composer.compact .c-row { align-items: center; }
        .composer.compact .c-row textarea { padding: 0; }
        .composer:focus-within { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--accent) 55%, transparent); }
        .composer.drop { box-shadow: 0 0 0 2px var(--accent); }
        .attach { display: flex; flex-wrap: wrap; gap: var(--s2); }
        .attach:empty { display: none; }
        .thumb { position: relative; width: 58px; height: 58px; border-radius: 12px; overflow: hidden; }
        .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .thumb button { position: absolute; top: 3px; right: 3px; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: rgba(0, 0, 0, .6); color: #fff; }
        .thumb button .icon { width: 12px; height: 12px; }
        .c-row { display: flex; align-items: flex-end; gap: 6px; }
        .c-row textarea { flex: 1; min-width: 0; max-height: 200px; padding: 7px 0; background: none; border: 0; outline: 0; resize: none; color: var(--text); font-size: 15px; line-height: 1.5; }
        .c-row textarea::placeholder { color: var(--text-3); }
        .c-btn { display: grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: 50%; color: var(--text-2); transition: background .12s var(--ease), color .12s var(--ease), opacity .12s var(--ease); }
        .c-btn:hover:not(:disabled) { background: var(--surface-3); color: var(--text); }
        .c-btn:disabled { opacity: .35; cursor: default; }
        .c-btn .icon { width: 18px; height: 18px; }
        .c-btn.send { background: var(--accent); color: var(--on-accent); }
        .c-btn.send:hover:not(:disabled) { background: var(--accent); filter: brightness(1.1); color: var(--on-accent); }
        .c-btn.send:disabled { background: var(--surface-3); color: var(--text-3); }
        .meter { margin-top: var(--s2); color: var(--text-3); font-size: 11.5px; text-align: center; }

        /* popups and dialogs (glass comes from paroxysm.css) */
        .pop { position: fixed; z-index: 45; width: 320px; max-width: calc(100vw - 16px); padding: var(--s1); border-radius: 20px; animation: menu-in .2s cubic-bezier(.2, 0, 0, 1) backwards; transform-origin: top right; }
        .pop > * { animation: menu-rise .4s cubic-bezier(.2, 0, 0, 1) backwards; animation-delay: calc(var(--i, 0) * 40ms + 50ms); }
        .pop.closing > * { animation: none; }
        .pop.closing { pointer-events: none; animation: menu-out .14s cubic-bezier(.4, 0, 1, 1) forwards; }
        .opt { display: flex; align-items: center; gap: var(--s3); width: 100%; padding: 8px var(--s3); border-radius: 14px; text-align: left; color: var(--text-2); }
        .opt:hover { background: var(--accent-soft); color: var(--text); }
        .opt .o-main { flex: 1; min-width: 0; }
        .opt .o-name { display: block; font-size: 13px; font-weight: 600; color: var(--text); }
        .opt .o-note { display: block; margin-top: 1px; font-size: 11.5px; color: var(--text-3); }
        .opt .o-tag { flex: none; padding: 2px 8px; border-radius: var(--pill); background: var(--surface-3); color: var(--text-2); font-size: 10.5px; font-weight: 600; }
        .opt .o-tag.lock { background: var(--accent-soft); color: var(--text); }
        .opt .icon { width: 15px; height: 15px; flex: none; color: var(--accent-2); }
        .toast { position: fixed; left: 50%; bottom: 96px; translate: -50% 0; z-index: 60; padding: 9px 16px; border-radius: var(--pill); font-size: 12.5px; color: var(--text); }

        @media (max-width: 820px) {
            body.ai { grid-template-columns: 0 minmax(0, 1fr); }
            .sb { position: fixed; z-index: 30; left: 0; top: 0; bottom: 0; width: 272px; visibility: visible; box-shadow: var(--shadow); transition: transform .2s var(--ease); }
            body.ai.sb-hidden .sb { transform: translateX(-100%); visibility: hidden; }
            .sb-open { display: grid; }
        }
    </style>
</head>

        <symbol id="i-settings" viewBox="0 0 24 24"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" /><circle cx="12" cy="12" r="3" /></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></symbol>
        <symbol id="i-refresh-cw" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" /></symbol>
        <symbol id="i-lightbulb" viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" /><path d="M9 18h6" /><path d="M10 22h4" /></symbol>
        <symbol id="i-code-xml" viewBox="0 0 24 24"><path d="m18 16 4-4-4-4" /><path d="m6 8-4 4 4 4" /><path d="m14.5 4-5 16" /></symbol>

        <symbol id="i-pen-line" viewBox="0 0 24 24"><path d="M13 21h8" /><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /></symbol>
    </svg>

    <aside class="sb" id="sb">
        <div class="sb-top" data-rise>
            <span class="sb-brand">paroxysm <b>AI</b></span>
            <button class="round-btn" id="sbHide" title="Hide sidebar" aria-label="Hide sidebar"><svg class="icon" aria-hidden="true"><use href="#i-panel-left" /></svg></button>
        </div>
        <button class="sb-new" id="newChat" data-rise><svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg><span>New chat</span></button>
        <label class="sb-search" data-rise><svg class="icon" aria-hidden="true"><use href="#i-search" /></svg><input id="chatSearch" type="text" placeholder="Search chats…" autocomplete="off" spellcheck="false" aria-label="Search chats"></label>
        <div class="sb-list" id="chatList" data-rise></div>
        <div class="usage" id="usage" data-rise></div>
    </aside>

    <main class="main">
        <header class="m-head" data-rise>
            <button class="round-btn sb-open" id="sbShow" title="Show sidebar" aria-label="Show sidebar"><svg class="icon" aria-hidden="true"><use href="#i-panel-left" /></svg></button>
            <h1 id="chatTitle" title="Rename chat">New chat</h1>
            <button class="model-btn" id="modelBtn" aria-haspopup="menu"><span id="modelName"></span><svg class="icon" aria-hidden="true"><use href="#i-chevron-down" /></svg></button>
            <button class="round-btn" id="delChat" title="Delete chat" aria-label="Delete chat"><svg class="icon" aria-hidden="true"><use href="#i-trash-2" /></svg></button>
        </header>
        <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>
        <button class="jump" id="jump" title="Jump to latest" aria-label="Jump to latest"><svg class="icon" aria-hidden="true"><use href="#i-arrow-down" /></svg></button>
        <div class="dock" data-rise>
            <div class="composer" id="composer">
                <div class="attach" id="attach"></div>
                <div class="c-row">
                    <textarea id="input" rows="1" placeholder="Ask anything…" aria-label="Message"></textarea>
                    <button class="c-btn" id="pick" title="Attach an image" aria-label="Attach an image"><svg class="icon" aria-hidden="true"><use href="#i-image" /></svg></button>
                    <button class="c-btn send" id="send" title="Send" aria-label="Send"><svg class="icon" aria-hidden="true"><use href="#i-arrow-up" /></svg></button>
                </div>
            </div>
            <p class="meter" id="meter"></p>
            <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
        </div>
    </main>

    <script>
        // AI page. The page draws; paroxysm-ai.js (window.paroxysmAI) does the work.
        const AI = window.paroxysmAI;
        const $ = id => document.getElementById(id);
        const { h, icon, openUrl, timeText, dialog, confirmBox, askText } = AI.ui;

        // ── talking to the shell ──
        const inShell = window.parent !== window;
        const shell = msg => { if (inShell) window.parent.postMessage(msg, location.origin); };
        shell({ type: "paroxysm-title", title: "AI" });

        // ── state ──
        let index = [];          // one light entry per saved chat
        let chat = null;         // the open chat: { id, title, created, updated, pinned, model, messages }
        let run = null;          // the running request: { ctrl }
        let pending = [];        // images waiting in the composer
        let stick = true;        // keep the view at the bottom while an answer streams
        let query = "";
        const refs = new WeakMap();   // message -> its elements
        const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        const plain = el => window.paroxysmCloak?.plainText ? window.paroxysmCloak.plainText(el) : el.textContent;

        const thread = $("thread"), scroller = $("scroll"), input = $("input"), sendBtn = $("send");

        // ── small helpers ──
        function toast(text) {
            document.querySelector(".toast")?.remove();
            const t = h("div", { class: "toast glass", text });
            document.body.append(t);
            setTimeout(() => t.remove(), 3200);
        }
        async function copyText(text) {
            try { await navigator.clipboard.writeText(text); return true; } catch {}
            const ta = h("textarea", { style: "position:fixed;opacity:0" });
            ta.value = text;
            document.body.append(ta);
            ta.select();
            const ok = document.execCommand("copy");
            ta.remove();
            return ok;
        }
        // ── chats: create, open, save, rename, pin, delete ──
        const currentModel = () => AI.modelById(chat.model) ?? AI.MODELS.at(-1);

        function newChat() {
            stopRun();
            chat = { id: uid(), title: "New chat", created: Date.now(), updated: Date.now(), pinned: false, model: AI.defaultModelId(), messages: [] };
            pending = [];
            input.value = "";
            renderAll();
            input.focus();
        }
        async function openChat(id) {
            if (chat?.id === id) return;
            stopRun();
            const c = await AI.store.get(id);
            if (!c) return;
            if (!AI.resolve(AI.modelById(c.model) ?? AI.MODELS.at(-1))) c.model = AI.defaultModelId();
            chat = c;
            pending = [];
            input.value = "";
            renderAll();
        }
        async function saveChat() {
            if (!chat.messages.length) return;
            chat.updated = Date.now();
            await AI.store.put(JSON.parse(JSON.stringify(chat)));
            const text = (chat.title + " " + chat.messages.map(m => m.content).join(" ")).toLowerCase();
            const entry = { id: chat.id, title: chat.title, created: chat.created, updated: chat.updated, pinned: !!chat.pinned, text };
            const at = index.findIndex(e => e.id === chat.id);
            if (at >= 0) index[at] = entry; else index.unshift(entry);
            renderList();
        }
        async function renameChat(id) {
            const entry = index.find(e => e.id === id) ?? (chat?.id === id ? chat : null);
            if (!entry) return;
            const t = await askText("Rename chat", "Name", entry.title);
            if (!t) return;
            const c = chat?.id === id ? chat : await AI.store.get(id);
            if (!c) return;
            c.title = t.slice(0, 80);
            await AI.store.put(JSON.parse(JSON.stringify(c)));
            const e = index.find(x => x.id === id);
            if (e) e.title = c.title;
            renderList(); renderHeader();
        }
        async function pinChat(id) {
            const c = chat?.id === id ? chat : await AI.store.get(id);
            if (!c) return;
            c.pinned = !c.pinned;
            await AI.store.put(JSON.parse(JSON.stringify(c)));
            const e = index.find(x => x.id === id);
            if (e) e.pinned = c.pinned;
            renderList();
        }
        async function deleteChat(id) {
            const e = index.find(x => x.id === id);
            if (!e && chat?.id === id && !chat.messages.length) return;
            if (!(await confirmBox("Delete this chat?", `"${(e ?? chat).title}" will be removed from this browser. This can't be undone.`, "Delete"))) return;
            await AI.store.delete(id);
            index = index.filter(x => x.id !== id);
            if (chat?.id === id) newChat(); else renderList();
        }

        // ── rendering: sidebar ──
        function groupOf(t) {
            const day = 86400e3, start = new Date(); start.setHours(0, 0, 0, 0);
            const d = start.getTime() - t;
            return d <= 0 ? "Today" : d <= day ? "Yesterday" : d <= 7 * day ? "Previous 7 days" : "Older";
        }
        function renderList() {
            const box = $("chatList");
            box.replaceChildren();
            const q = query.trim().toLowerCase();
            const rows = index.filter(e => !q || e.text.includes(q)).sort((a, b) => b.updated - a.updated);
            if (!rows.length) { box.append(h("div", { class: "none", text: q ? "No chats match." : "Your chats will show up here." })); return; }
            const groups = new Map();
            for (const e of rows) {
                const g = e.pinned ? "Pinned" : groupOf(e.updated);
                if (!groups.has(g)) groups.set(g, []);
                groups.get(g).push(e);
            }
            for (const name of ["Pinned", "Today", "Yesterday", "Previous 7 days", "Older"]) {
                const list = groups.get(name);
                if (!list) continue;
                box.append(h("div", { class: "grp", text: name }));
                for (const e of list) {
                    const act = (name, title, fn) => h("button", { title, "aria-label": title, onclick: ev => { ev.stopPropagation(); fn(); } }, icon(name));
                    box.append(h("div", { class: "chat" + (chat?.id === e.id ? " on" : ""), role: "button", tabindex: "0", title: e.title, onclick: () => openChat(e.id),
                        onkeydown: ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openChat(e.id); } } },
                        icon(e.pinned ? "pin" : "message-square"), h("span", { class: "t", text: e.title }),
                        h("span", { class: "acts" }, act("pin", e.pinned ? "Unpin" : "Pin", () => pinChat(e.id)), act("pencil", "Rename", () => renameChat(e.id)), act("trash-2", "Delete", () => deleteChat(e.id)))));
                }
            }
        }

        // ── rendering: usage ──
        function sourceKind() { return AI.resolve(currentModel())?.kind ?? "none"; }
        function renderUsage() {
            const kind = sourceKind(), u = AI.usage.get(), cap = AI.settings.get().cap, reset = "Resets " + timeText(AI.nextReset());
            const capped = kind !== "own" && kind !== "puter";
            const left = Math.max(0, cap - u.capped);
            const badge = kind === "own" ? "YOUR KEY" : kind === "shared" ? "SHARED" : kind === "puter" ? "PUTER" : kind === "quick" ? "QUICK" : "NO KEY";
            const box = $("usage");
            box.replaceChildren(
                h("div", { class: "u-top" }, h("span", {}, icon("gauge"), "Usage"), h("span", { class: "badge", text: badge })),
                h("div", { class: "bar" }, h("i", { style: `width:${capped ? Math.min(100, Math.round(u.capped / cap * 100)) : 0}%` })),
                h("div", { class: "u-grid" },
                    h("span", { text: capped ? `${u.capped}/${cap}` : `${u.own} today` }), h("span", { text: capped ? `${left} left` : kind === "puter" ? "Puter's own limit" : "no limit here" }),
                    h("span", { text: u.chars.toLocaleString() + " chars" }), h("span", { text: u.images + " images" })),
                h("div", { class: "u-reset", text: reset }),
                h("div", { class: "u-foot" }, h("button", { onclick: () => openSettings() }, icon("settings"), "AI settings")));
            const meter = capped
                ? `${u.capped}/${cap} today · ${left} remaining · ${reset.toLowerCase()}`
                : kind === "puter" ? `${u.own} today · Puter has its own monthly allowance` : `${u.own} today on your key · no paroxysm limit`;
            $("meter").textContent = meter;
        }

        // ── rendering: header, composer state ──
        function renderHeader() {
            $("chatTitle").textContent = chat.title;
            $("modelName").textContent = currentModel().name;
            $("delChat").style.visibility = chat.messages.length ? "visible" : "hidden";
        }
        function renderComposer() {
            const busy = !!run, vision = currentModel().vision;
            $("pick").disabled = !vision || busy;
            $("pick").title = vision ? "Attach an image" : "This model can't see images";
            sendBtn.replaceChildren(icon(busy ? "square" : "arrow-up"));
            sendBtn.title = sendBtn.ariaLabel = busy ? "Stop" : "Send";
            sendBtn.disabled = !busy && !input.value.trim() && !pending.length;
            $("composer").classList.toggle("compact", !input.value && !pending.length);
            autosize();                                   // the text box's padding changes with the compact state
            const at = $("attach");
            at.replaceChildren(...pending.map((p, i) => h("div", { class: "thumb" }, h("img", { src: `data:${p.mime};base64,${p.data}`, alt: "" }),
                h("button", { title: "Remove", "aria-label": "Remove image", onclick: () => { pending.splice(i, 1); renderComposer(); } }, icon("x")))));
        }
        function autosize() {
            input.style.height = "auto";
            input.style.height = Math.min(input.scrollHeight, 200) + "px";
        }

        // ── rendering: the thread ──
        const CHIPS = [
            ["atom", "Explain how photosynthesis works"], ["pen-line", "Help me write an email to my teacher"],
            ["code-xml", "Show me a Python function that sorts a list"], ["lightbulb", "Give me ideas for a science project"]];

        function renderHero() {
            const kind = sourceKind();
            const note = h("p", { class: "src-note" });
            if (kind === "quick") note.append("Answering with Quick (GPT-OSS 20B), which needs no key, goes through the proxy and can't see images. For images and smarter answers, ", h("button", { text: "add your own free key", onclick: openSettings }), ".");
            else if (kind === "puter") note.append("Answering through your Puter account, which has its own monthly allowance. Prompts go to Puter and then to the model's provider. Don't send passwords or personal details.");
            else if (kind === "shared") note.append("Using the shared key. If it runs out, Quick takes over. For your own quota, ", h("button", { text: "add your key", onclick: openSettings }), ".");
            else note.append("Prompts may be used by the provider to improve its products. Don't send passwords or personal details.");
            const hero = h("div", { class: "hero", id: "hero" },
                h("h2", { text: "What can I help you with today?", "data-rise": "" }),
                h("div", { class: "chips", "data-rise": "" }, CHIPS.map(([ic, text]) => h("button", { class: "chip", onclick: () => send(text) }, icon(ic), text))),
                h("div", { "data-rise": "" }, note));
            thread.append(hero);
            window.paroxysmRise?.run(hero);
        }

        function userNode(m, last) {
            const root = h("div", { class: "msg user" });
            if (m.images?.length) root.append(h("div", { class: "pics" }, m.images.map(i => h("img", { src: `data:${i.mime};base64,${i.data}`, alt: "Attached image" }))));
            if (m.content) root.append(h("div", { class: "bubble", text: m.content }));
            if (last && !run) root.append(h("div", { class: "acts" }, h("button", { class: "a-btn", title: "Edit message", "aria-label": "Edit message", onclick: editLast }, icon("pencil"))));
            return root;
        }

        function aiNode(m, last) {
            const label = h("span");
            const tbody = h("div", { class: "t-body md" });
            const thought = h("details", { class: "thought" }, h("summary", {}, icon("sparkles"), label, icon("chevron-down")), tbody);
            const note = h("div", { class: "note" });
            const body = h("div", { class: "md" });
            const err = h("div", { class: "err-card" });
            const acts = h("div", { class: "acts" });
            const root = h("div", { class: "msg ai" }, note, thought, body, err, acts);
            refs.set(m, { root, label, tbody, thought, note, body, err, acts, last });
            paintAi(m, false);
            return root;
        }
        let lastBodyHtml = new WeakMap();
        function paintAi(m, live) {
            const r = refs.get(m);
            if (!r) return;
            r.note.style.display = m.notice ? "" : "none";
            if (m.notice) r.note.textContent = m.notice;
            r.thought.style.display = m.thought ? "" : "none";
            r.thought.classList.toggle("live", !!live && !m.content);
            if (m.thought) {
                r.label.textContent = live && !m.content ? "Thinking…" : "Thought for " + Math.max(0.1, (m.thoughtMs || 0) / 1000).toFixed(1) + "s";
                r.tbody.innerHTML = AI.render(m.thought);
            }
            if (m.content) r.body.innerHTML = AI.render(m.content);
            else if (live && !m.thought) r.body.replaceChildren(h("div", { class: "dots", "aria-label": "Thinking" }, h("i"), h("i"), h("i")));
            else r.body.replaceChildren();
            r.err.style.display = m.error ? "" : "none";
            if (m.error) paintError(m, r);
            r.acts.style.display = live ? "none" : "";
            if (!live) {
                r.acts.replaceChildren(...[
                    h("button", { class: "a-btn", title: "Copy", "aria-label": "Copy answer", onclick: async e => { const b = e.currentTarget; if (await copyText(m.content)) { b.replaceChildren(icon("check")); setTimeout(() => b.replaceChildren(icon("copy")), 1400); } } }, icon("copy")),
                    r.last ? h("button", { class: "a-btn", title: "Regenerate", "aria-label": "Regenerate answer", onclick: regenerate }, icon("refresh-cw")) : null,
                    m.model ? h("span", { class: "by", text: AI.modelById(m.model)?.name ?? "" }) : null].filter(Boolean));
                if (!m.content) r.acts.style.display = "none";
            }
        }
        function paintError(m, r) {
            const e = m.error;
            r.err.replaceChildren(h("div", { text: e.text }), h("div", { class: "row-btns" },
                e.kind === "key" || e.kind === "cap" || e.kind === "balance" ? h("button", { class: "btn", text: e.kind === "cap" ? "Add your own key" : "Open settings", onclick: openSettings }) : null,
                e.kind === "network" ? h("button", { class: "btn", text: "Open settings", onclick: openSettings }) : null,
                e.kind !== "cap" ? h("button", { class: "btn", text: "Try again", onclick: retry }) : null));
        }

        function renderThread() {
            thread.replaceChildren();
            if (!chat.messages.length) { renderHero(); return; }
            chat.messages.forEach((m, i) => thread.append(m.role === "user" ? userNode(m, i === chat.messages.length - 2 || i === chat.messages.length - 1) : aiNode(m, i === chat.messages.length - 1)));
            scrollDown(true);
        }
        function renderAll() {
            renderList(); renderHeader(); renderThread(); renderComposer(); renderUsage(); autosize();
        }

        // ── scrolling ──
        function scrollDown(force) {
            if (force) stick = true;
            if (stick) scroller.scrollTop = scroller.scrollHeight;
            $("jump").classList.toggle("show", !stick && !!run);
        }
        scroller.addEventListener("scroll", () => {
            stick = scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 60;
            $("jump").classList.toggle("show", !stick && !!run);
        });
        $("jump").addEventListener("click", () => scrollDown(true));

        // ── sending ──
        function errorOf(e) {
            const cap = AI.settings.get().cap;
            if (e.provider === "puter") return { kind: e.kind || "other", text: e.message };
            switch (e.kind) {
                case "cap": return { kind: "cap", text: `${e.message} It resets at ${timeText(AI.nextReset())}. Add your own key to keep going.` };
                case "key": return { kind: "key", text: `The key was rejected: ${e.message}` };
                case "balance": return { kind: "balance", text: `That account has no balance left: ${e.message}` };
                case "quota": return { kind: "quota", text: `That model is out of free requests for now (${e.message}). Try again later or pick another model.` };
                case "network": return { kind: "network", text: /proxy/i.test(e.message) ? e.message + " Quick needs the proxy connection; wait for it, or pick a model you have a key for." : `Couldn't reach the provider (${e.message}). If your network blocks it, turn on "Send AI requests through the proxy" in Settings.` };
                default: return { kind: e.kind || "other", text: e.message || "Something went wrong." };
            }
        }

        function setBusy(on) {
            renderComposer();
            if (!on) { $("jump").classList.remove("show"); }
        }
        function stopRun() { run?.ctrl.abort(); }

        async function generate() {
            const m = { role: "assistant", content: "", thought: "", thoughtMs: 0, model: chat.model, ts: Date.now() };
            chat.messages.push(m);
            const owner = chat;
            // the last user message and this answer are the "latest" pair (they get the edit / regenerate buttons)
            renderThread();
            const ctrl = new AbortController();
            run = { ctrl };
            setBusy(true);
            paintAi(m, true);
            let raf = 0;
            const refresh = () => { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; if (chat !== owner) return; paintAi(m, true); scrollDown(); }); };
            try {
                const r = await AI.run({
                    modelId: owner.model, messages: owner.messages.slice(0, -1), signal: ctrl.signal,
                    onThought: t => { m.thought = t; refresh(); }, onText: t => { m.content = t; refresh(); }
                });
                m.content = r.text; m.thought = r.thought; m.thoughtMs = r.thoughtMs; m.model = r.model.id;
                if (r.fallbackFrom) m.notice = `${r.fallbackFrom} is out of requests right now, so Quick answered this one.`;
            } catch (e) {
                if (e.name === "AbortError") { if (!m.content && !m.thought) owner.messages.pop(); }
                else m.error = errorOf(e instanceof AI.AIError ? e : new AI.AIError("other", e.message));
            } finally {
                cancelAnimationFrame(raf);
                run = null;
                if (chat === owner) { renderThread(); renderHeader(); renderComposer(); renderUsage(); }
                if (owner.messages.length) { const keep = chat; chat = owner; await saveChat(); chat = keep; }
            }
        }

        async function send(text) {
            text = String(text ?? input.value).trim();
            if (run) return;
            if (!text && !pending.length) return;
            const model = currentModel();
            if (pending.length && !model.vision) { toast(`${model.name} can't see images. Pick another model.`); return; }
            chat.messages.push({ role: "user", content: text, images: pending.map(p => ({ mime: p.mime, data: p.data })), ts: Date.now() });
            if (chat.messages.length === 1) chat.title = AI.titleFrom(text || "Image");
            pending = [];
            input.value = "";
            autosize();
            renderHeader();
            await generate();
        }
        function retry() {
            if (run) return;
            if (chat.messages.at(-1)?.role === "assistant" && chat.messages.at(-1).error) chat.messages.pop();
            generate();
        }
        function regenerate() {
            if (run) return;
            while (chat.messages.length && chat.messages.at(-1).role === "assistant") chat.messages.pop();
            generate();
        }
        function editLast() {
            if (run) return;
            let i = chat.messages.length - 1;
            while (i >= 0 && chat.messages[i].role !== "user") i--;
            if (i < 0) return;
            const u = chat.messages[i];
            chat.messages.length = i;
            input.value = u.content;
            pending = (u.images ?? []).map(x => ({ ...x }));
            if (!chat.messages.length) chat.title = "New chat";
            renderThread(); renderHeader(); renderComposer(); autosize();
            input.focus();
        }

        // ── images in the composer ──
        async function addFiles(files) {
            const model = currentModel();
            if (!model.vision) { toast(`${model.name} can't see images. Pick another model.`); return; }
            for (const f of files) {
                if (pending.length >= 4) { toast("You can attach up to 4 images."); break; }
                try { pending.push(await AI.prepareImage(f)); } catch (e) { toast(e.message); }
            }
            renderComposer();
        }
        $("pick").addEventListener("click", () => $("file").click());
        $("file").addEventListener("change", e => { addFiles([...e.target.files]); e.target.value = ""; });
        input.addEventListener("paste", e => {
            const files = [...(e.clipboardData?.files ?? [])].filter(f => f.type.startsWith("image/"));
            if (files.length) { e.preventDefault(); addFiles(files); }
        });
        const composer = $("composer");
        ["dragenter", "dragover"].forEach(t => composer.addEventListener(t, e => { if ([...(e.dataTransfer?.types ?? [])].includes("Files")) { e.preventDefault(); composer.classList.add("drop"); } }));
        ["dragleave", "drop"].forEach(t => composer.addEventListener(t, () => composer.classList.remove("drop")));
        composer.addEventListener("drop", e => { e.preventDefault(); addFiles([...e.dataTransfer.files].filter(f => f.type.startsWith("image/"))); });

        input.addEventListener("input", () => { autosize(); renderComposer(); });
        input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
        sendBtn.addEventListener("click", () => run ? stopRun() : send());
        addEventListener("keydown", e => { if (e.key === "Escape" && run && !document.querySelector(".modal-back, .pop")) stopRun(); });

        // ── model picker ──
        function closePop() {
            const p = document.querySelector(".pop");
            if (!p) return;
            p.classList.add("closing");
            p.addEventListener("animationend", () => p.remove());
            setTimeout(() => p.remove(), 300);
        }
        function openModels() {
            if (document.querySelector(".pop:not(.closing)")) { closePop(); return; }
            const pop = h("div", { class: "pop glass", role: "menu" }, AI.MODELS.map(m => {
                const src = AI.resolve(m);
                const tag = !src ? h("span", { class: "o-tag lock", text: m.provider === "puter" ? "Sign in" : "Add key" }) : src.kind === "puter" ? h("span", { class: "o-tag", text: "Puter" }) : src.kind === "own" ? h("span", { class: "o-tag", text: "Your key" }) : src.kind === "shared" ? h("span", { class: "o-tag", text: "Shared" }) : null;
                return h("button", { class: "opt", role: "menuitem", onclick: () => { closePop(); if (!src) { openSettings(m.provider); return; } chat.model = m.id; AI.settings.set({ model: m.id }); if (m.vision === false && pending.length) { pending = []; toast("Images removed: this model can't see them."); } renderHeader(); renderComposer(); renderUsage(); if (!chat.messages.length) renderThread(); if (chat.messages.length) saveChat(); } },
                    h("span", { class: "o-main" }, h("span", { class: "o-name", text: m.name }), h("span", { class: "o-note", text: m.note })), tag, chat.model === m.id ? icon("check") : null);
            }));
            [...pop.children].forEach((c, i) => c.style.setProperty("--i", i));
            document.body.append(pop);
            const r = $("modelBtn").getBoundingClientRect();
            pop.style.left = Math.max(8, Math.min(r.right - pop.offsetWidth, innerWidth - pop.offsetWidth - 8)) + "px";
            pop.style.top = (r.bottom + 6) + "px";
        }
        $("modelBtn").addEventListener("click", openModels);
        addEventListener("pointerdown", e => { if (!e.target.closest(".pop, #modelBtn")) closePop(); }, true);
        addEventListener("blur", closePop);
        addEventListener("keydown", e => { if (e.key === "Escape") closePop(); });

        // ── settings dialog (the same panel as Settings > AI) ──
        function openSettings(focusProvider) {
            AI.ui.dialog({
                title: "AI settings", wide: true, actions: [{ label: "Done", primary: true }],
                content: AI.ui.aiSettings({ style: "dialog", focusProvider: typeof focusProvider === "string" ? focusProvider : "", onChange: afterKeys, onDeleteAll: () => { index = []; newChat(); } })
            });
        }
        function afterKeys() {
            if (!AI.resolve(currentModel())) chat.model = AI.defaultModelId();
            renderHeader(); renderComposer(); renderUsage();
            if (!chat.messages.length) renderThread();
        }

        // ── clicks inside the thread: copy code, open links through the proxy ──
        thread.addEventListener("click", e => {
            const copy = e.target.closest("[data-copy]");
            if (copy) {
                const code = copy.closest(".code")?.querySelector("pre");
                if (code) copyText(code.textContent).then(ok => { if (ok) { copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1400); } });
                return;
            }
            const a = e.target.closest("a[data-ext]");
            if (a) { e.preventDefault(); openUrl(a.href); }
        });

        // ── sidebar and header buttons ──
        const SB_KEY = "paroxysm:ai-sidebar";
        const setSidebar = open => { document.body.classList.toggle("sb-hidden", !open); try { localStorage.setItem(SB_KEY, open ? "1" : "0"); } catch {} };
        $("sbHide").addEventListener("click", () => setSidebar(false));
        $("sbShow").addEventListener("click", () => setSidebar(true));
        $("newChat").addEventListener("click", newChat);
        $("chatSearch").addEventListener("input", e => { query = e.target.value; renderList(); });
        $("delChat").addEventListener("click", () => deleteChat(chat.id));
        $("chatTitle").addEventListener("click", () => { if (chat.messages.length) renameChat(chat.id); });
        addEventListener("storage", e => { if (chat && e.key && e.key.startsWith("paroxysm:ai")) { renderUsage(); renderHeader(); } });
        setInterval(() => { if (chat) renderUsage(); }, 30000);

        // ── start ──
        (async () => {
            let open = innerWidth > 820;
            try { const v = localStorage.getItem(SB_KEY); if (v != null && innerWidth > 820) open = v === "1"; } catch {}
            document.body.classList.toggle("sb-hidden", !open);
            try { index = await AI.store.index(); } catch (e) { console.error("[paroxysm] AI chat storage unavailable:", e); }
            newChat();
        })();
    </script>
</body>

</html>
