<!DOCTYPE html>
<html lang="en" class="page">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
    <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="paroxysm.css">
    <link rel="icon" href="assets/paroxysm/paroxysm_darkmode_favicon.ico" sizes="any">
    <script src="paroxysm-settings.js"></script>
    <script src="paroxysm-rise.js"></script>
    <style>
        body.games { background: var(--surface); min-height: 100vh; }
        .wrap { max-width: 1120px; margin: 0 auto; padding: 32px var(--s5) var(--s7); }

        /* header */
        .g-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s4); flex-wrap: wrap; margin-bottom: var(--s4); }
        .g-head h1 { font-size: 28px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
        .seg.src { grid-template-columns: repeat(2, auto); margin-bottom: 0; }
        .seg.src button { padding: 0 var(--s4); }
        .g-search { display: flex; align-items: center; gap: var(--s2); height: 44px; padding: 0 var(--s2) 0 var(--s4); margin-bottom: var(--s4); background: var(--surface-2); border-radius: var(--pill); color: var(--text-3); }
        .g-search input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: 0; color: var(--text); font-size: 14px; }
        .g-search input::placeholder { color: var(--text-2); }
        .g-search .icon { width: 17px; height: 17px; }
        .round-btn { display: grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: 50%; color: var(--text-2); transition: background .12s var(--ease), color .12s var(--ease); }
        .round-btn:hover { background: var(--surface-3); color: var(--text); }
        .round-btn .icon { width: 17px; height: 17px; }
        .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; margin-bottom: var(--s4); background: var(--surface-2); border-radius: var(--pill); }
        .seg button { height: 36px; border-radius: var(--pill); color: var(--text-2); font-size: 13px; font-weight: 500; transition: background .12s var(--ease), color .12s var(--ease); }
        .seg button small { margin-left: 4px; font-size: 11px; opacity: .7; }
        .seg button:not(.on):hover { background: var(--accent-soft); color: var(--text); }
        .seg button.on { background: var(--accent); color: var(--on-accent); }
        .chips { display: flex; gap: var(--s2); margin-bottom: var(--s5); }
        .chips .chip-btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 var(--s4); border-radius: var(--pill); background: var(--surface-2); color: var(--text-2); font-size: 13px; font-weight: 500; }
        .chips .chip-btn small { font-size: 11px; opacity: .7; }
        .chips .chip-btn.on { background: var(--accent); color: var(--on-accent); }

        /* grid and cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: var(--s4); }
        .g-card { position: relative; display: flex; flex-direction: column; gap: 8px; text-align: left; cursor: pointer; animation: pop .25s var(--ease) both; }
        @keyframes pop { from { opacity: 0; translate: 0 6px; } to { opacity: 1; translate: 0 0; } }
        .g-card .cover { aspect-ratio: 1; width: 100%; border-radius: 18px; background: var(--surface-2); overflow: hidden; transition: transform .15s var(--ease); }
        .g-card .cover img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .25s var(--ease); }
        .g-card .cover img.ok { opacity: 1; }
        .g-card:hover .cover, .g-card:focus-visible .cover { transform: translateY(-2px); }
        .g-card .name { font-size: 13px; font-weight: 500; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
        .g-card:hover .name { color: var(--text); }
        .fav { position: absolute; top: 8px; right: 8px; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: rgba(0, 0, 0, .5); backdrop-filter: blur(8px); color: #fff; opacity: 0; transition: opacity .12s var(--ease), background .12s var(--ease); }
        .fav .icon { width: 16px; height: 16px; }
        .g-card:hover .fav, .g-card:focus-within .fav, .fav.on { opacity: 1; }
        .fav:hover { background: rgba(0, 0, 0, .7); }
        .fav.on .icon { fill: var(--accent); stroke: var(--accent); }
        .more { display: flex; justify-content: center; margin-top: var(--s5); }
        .status { padding: var(--s7) 0; text-align: center; color: var(--text-3); }
        .notice { padding: var(--s5); background: var(--surface-2); border-radius: var(--r-card); color: var(--text-2); line-height: 1.7; }
        .notice h3 { color: var(--text); font-size: 15px; margin-bottom: var(--s2); }
        .notice .btn { margin-top: var(--s4); }

        /* player */
        .pl-top { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s3); }
        .pl-top .btn { height: 36px; padding: 0 var(--s4); }
        .pl-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
        .pl-top .fav-btn.on .icon { fill: var(--accent); stroke: var(--accent); }
        .stage { display: grid; grid-template-columns: 104px minmax(0, 1fr) 104px; gap: var(--s4); align-items: start; }
        .side { display: flex; flex-direction: column; gap: var(--s3); }
        .side .g-card .cover { border-radius: 14px; }
        .side .g-card .name { display: none; }
        .frame { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: var(--r-card); overflow: hidden; }
        .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
        .frame:fullscreen { border-radius: 0; aspect-ratio: auto; }
        .frame .loading { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; padding: var(--s5); background: #000; color: #888; text-align: center; }
        .frame .loading[hidden] { display: none; }
        .frame .notice { max-width: 440px; text-align: left; }
        h2.sub { margin: var(--s6) 0 var(--s4); font-size: 18px; font-weight: 600; letter-spacing: -.02em; }
        @media (max-width: 1000px) { .stage { grid-template-columns: minmax(0, 1fr); } .side { display: none; } }
    </style>
</head>

<body class="games">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-search" viewBox="0 0 24 24"><path d="m21 21-4.34-4.34" /><circle cx="11" cy="11" r="8" /></symbol>
        <symbol id="i-dices" viewBox="0 0 24 24"><rect width="12" height="12" x="2" y="10" rx="2" ry="2" /><path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6" /><path d="M6 18h.01" /><path d="M10 14h.01" /><path d="M15 6h.01" /><path d="M18 9h.01" /></symbol>
        <symbol id="i-heart" viewBox="0 0 24 24"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5" /></symbol>
        <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></symbol>
        <symbol id="i-maximize" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3" /><path d="M21 8V5a2 2 0 0 0-2-2h-3" /><path d="M3 16v3a2 2 0 0 0 2 2h3" /><path d="M16 21h3a2 2 0 0 0 2-2v-3" /></symbol>
        <symbol id="i-minimize" viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3" /><path d="M21 8h-3a2 2 0 0 1-2-2V3" /><path d="M3 16h3a2 2 0 0 1 2 2v3" /><path d="M16 21v-3a2 2 0 0 1 2-2h3" /></symbol>
        <symbol id="i-rotate-cw" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /></symbol>
    </svg>

    <div class="wrap" id="app"></div>

    <script>
        // two game sources behind one interface: ready list random cover play
        // gn-math: catalogue plus html pages and covers from jsDelivr repos
        // LuminSDK: headless; SDK hands out single-use game links
        // urls: paroxysm://games and paroxysm://games?g=<id>&s=<gnmath|lumin>
        // LuminSDK script pinned to commit with integrity hash (runs in own origin)
        // gn-math pages are third-party: only run in sandboxed iframe (see GAME_SANDBOX)
        const SDK_URL = "https://cdn.jsdelivr.net/gh/luminsdk/script@e1107337f26529e032d7873cbbb310d485d5d403/fonts.min.js";
        const SDK_SRI = "sha384-SgXJY217C22inNWfmmJ3ffxB1rIh4BmSkT9PDfvMqXoNI1p/td9wKrAjt8SboUHv";
        const GN = {
            assets: "https://cdn.jsdelivr.net/gh/freebuisness/assets@main/",
            html: "https://cdn.jsdelivr.net/gh/freebuisness/html@main/",
            covers: "https://cdn.jsdelivr.net/gh/freebuisness/covers@main/"
        };
        const GN_ANALYTICS_ID = "G-L7856P3VNT"; // original site's Google Analytics id; stripped from game pages
        // emulator games need IndexedDB (missing in sandbox): hidden; empty list to bring back
        const GN_HIDDEN_TAGS = ["emulator", "dos", "psx", "n64", "nds", "gba", "nes"];
        // no allow-same-origin on purpose: opaque origin cannot read paroxysm storage
        // cost: games needing localStorage/IndexedDB/cookies may not save
        const GAME_SANDBOX = "allow-scripts allow-pointer-lock allow-popups allow-forms allow-modals allow-downloads";
        const PAGE_SIZE = 36;
        const MAX_RECENTS = 24;
        const SOURCE_IDS = ["gnmath", "lumin"];
        const DEFAULT_SOURCE = "gnmath";

        const $ = id => document.getElementById(id);
        const app = $("app");
        const SVG = "http://www.w3.org/2000/svg";

        function icon(name) {
            const svg = document.createElementNS(SVG, "svg");
            svg.setAttribute("class", "icon"); svg.setAttribute("aria-hidden", "true");
            const use = document.createElementNS(SVG, "use"); use.setAttribute("href", "#i-" + name);
            svg.appendChild(use); return svg;
        }
        function h(tag, props = {}, ...kids) {
            const el = document.createElement(tag);
            for (const [k, v] of Object.entries(props)) {
                if (k === "class") el.className = v;
                else if (k === "text") el.textContent = v;
                else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
                else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
            }
            kids.flat().forEach(c => c != null && el.append(c));
            return el;
        }

        // local pages ask shell to open move or rename a tab
        const inShell = window.parent !== window;
        function shell(msg, fallbackUrl) {
            if (inShell) window.parent.postMessage(msg, location.origin);
            else if (fallbackUrl) location.href = fallbackUrl;
        }
        // no source = LuminSDK game (saved before picker existed)
        const srcOf = g => g.s === "gnmath" ? "gnmath" : "lumin";
        const keyOf = g => srcOf(g) + ":" + g.id;
        const gameQuery = g => "?g=" + encodeURIComponent(g.id) + "&s=" + srcOf(g);
        const gameUrl = g => "paroxysm://games" + gameQuery(g);
        const openGame = g => shell({ type: "paroxysm-open", url: gameUrl(g) }, "games.html" + gameQuery(g));
        const goGames = () => shell({ type: "paroxysm-open", url: "paroxysm://games" }, "games.html");

        const STORE_KEY = "paroxysm:games";
        const slim = g => ({ id: g.id, name: g.name, category: g.category || "", s: srcOf(g) });
        function readStore() {
            try {
                const d = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
                return {
                    favorites: Array.isArray(d.favorites) ? d.favorites : [],
                    recents: Array.isArray(d.recents) ? d.recents : [],
                    source: SOURCE_IDS.includes(d.source) ? d.source : DEFAULT_SOURCE
                };
            } catch { return { favorites: [], recents: [], source: DEFAULT_SOURCE }; }
        }
        function writeStore(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch {} }
        const isFav = key => readStore().favorites.some(g => keyOf(g) === key);
        function toggleFav(g) {
            const s = readStore();
            const i = s.favorites.findIndex(x => keyOf(x) === keyOf(g));
            if (i >= 0) s.favorites.splice(i, 1); else s.favorites.unshift(slim(g));
            writeStore(s);
            refreshFavs();
        }
        function pushRecent(g) {
            const s = readStore();
            s.recents = [slim(g), ...s.recents.filter(x => keyOf(x) !== keyOf(g))].slice(0, MAX_RECENTS);
            writeStore(s);
        }

        // source: LuminSDK
        let sdk = null;
        function loadSdk() {
            sdk ??= (async () => {
                if (!window.Lumin) {
                    await new Promise((resolve, reject) => {
                        const s = document.createElement("script");
                        s.src = SDK_URL; s.integrity = SDK_SRI; s.crossOrigin = "anonymous";
                        s.onload = resolve; s.onerror = () => reject(new Error("The game library could not be loaded."));
                        document.head.appendChild(s);
                    });
                }
                await Promise.race([Lumin.init({ headless: true }), new Promise((_, rej) => setTimeout(() => rej(new Error("The game library did not respond.")), 20000))]);
            })();
            sdk.catch(() => { sdk = null; });
            return sdk;
        }
        const luminTokens = new Map(), luminCovers = new Map();
        const lumin = {
            label: "LuminSDK",
            ready: loadSdk,
            async list({ page, q }) {
                await loadSdk();
                const r = await Lumin.getGames({ page, limit: PAGE_SIZE, q });
                r.games.forEach(g => { g.s = "lumin"; luminTokens.set(g.id, g.image_token); });
                return r;
            },
            async random(n) {
                await loadSdk();
                const r = await Lumin.getRandomGames(n);
                return (r.games || []).map(g => (g.s = "lumin", g));
            },
            async cover(game) {
                if (luminCovers.has(game.id)) return luminCovers.get(game.id);
                await loadSdk();
                let token = game.image_token || luminTokens.get(game.id);
                if (!token) { // favourites and recents keep only id and name
                    const r = await Lumin.getGames({ q: game.name, limit: 24 });
                    r.games.forEach(x => luminTokens.set(x.id, x.image_token));
                    token = luminTokens.get(game.id);
                }
                if (!token) return "";
                const url = await Lumin.getImageUrl(token);
                luminCovers.set(game.id, url);
                return url;
            },
            // fresh single-use link per call
            async play(id) {
                await loadSdk();
                const res = await Lumin.getGameUrl(id);
                if (!res || !res.url) throw new Error("LuminSDK did not return a game link for this id.");
                return { url: res.url, meta: res.meta || {} };
            }
        };

        // source: gn-math
        // zones.json lists games; {HTML_URL} and {COVER_URL} stand for html and covers repos
        // jsDelivr serves .html as text/plain: fetch as text and use srcdoc
        let gnData = null;
        function gnLoad() {
            gnData ??= fetch(GN.assets + "zones.json")
                .catch(() => { throw new Error("The gn-math library could not be loaded."); })
                .then(r => { if (!r.ok) throw new Error("The gn-math library could not be loaded (HTTP " + r.status + ")."); return r.json(); })
                .then(zones => {
                    const byId = new Map();
                    for (const z of Array.isArray(zones) ? zones : []) {
                        // skips id -1 (Discord) and [!] pseudo-entries
                        if (!z || !(z.id >= 0) || typeof z.name !== "string" || z.name.startsWith("[!]") || typeof z.url !== "string" || !z.url.startsWith("{HTML_URL}/")) continue;
                        const tags = Array.isArray(z.special) ? z.special : [];
                        if (tags.some(t => GN_HIDDEN_TAGS.includes(t))) continue;
                        const game = { id: String(z.id), name: z.name, category: tags.join(", "), s: "gnmath" };
                        byId.set(game.id, { game, url: z.url.slice("{HTML_URL}/".length), cover: z.cover, featured: !!z.featured });
                    }
                    const games = [...byId.values()].sort((a, b) => (b.featured - a.featured) || a.game.name.localeCompare(b.game.name)).map(d => d.game);
                    return { games, byId };
                });
            gnData.catch(() => { gnData = null; });
            return gnData;
        }
        // strips original site's analytics snippet (before doctype)
        function stripAnalytics(html) {
            const head = html.slice(0, 2000)
                .replace(/<script[^>]*googletagmanager\.com\/gtag\/js\?id=[^>]*>\s*<\/script>\s*/i, m => m.includes(GN_ANALYTICS_ID) ? "" : m)
                .replace(/<script>\s*window\.dataLayer[\s\S]*?<\/script>\s*/i, m => m.includes(GN_ANALYTICS_ID) ? "" : m);
            return head + html.slice(2000);
        }
        const gnmath = {
            label: "gn-math",
            ready: gnLoad,
            async list({ page, q }) {
                const { games } = await gnLoad();
                const needle = q.toLowerCase();
                const found = needle ? games.filter(g => g.name.toLowerCase().includes(needle)) : games;
                return { games: found.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE), total: found.length, page, pages: Math.max(1, Math.ceil(found.length / PAGE_SIZE)) };
            },
            async random(n) {
                const pool = [...(await gnLoad()).games], out = [];
                while (out.length < n && pool.length) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
                return out;
            },
            async cover(game) {
                const d = (await gnLoad()).byId.get(game.id);
                return d && typeof d.cover === "string" && d.cover.startsWith("{COVER_URL}/") ? GN.covers + encodeURI(d.cover.slice("{COVER_URL}/".length)) : "";
            },
            async play(id) {
                const d = (await gnLoad()).byId.get(String(id));
                if (!d) throw new Error("This game isn't in the gn-math library.");
                const res = await fetch(GN.html + encodeURI(d.url)).catch(() => { throw new Error("The game could not be downloaded."); });
                if (!res.ok) throw new Error("The game file could not be loaded (HTTP " + res.status + "). Very large games are not available through jsDelivr.");
                return { html: stripAnalytics(await res.text()), meta: { name: d.game.name, category: d.game.category } };
            }
        };

        // sandboxed games have no storage: bridge gives in-memory versions; page persists localStorage
        const SAVES_KEY = "paroxysm:game-saves", MAX_SAVES = 10, MAX_SAVE_CHARS = 300000;
        function readSaves() {
            try { const d = JSON.parse(localStorage.getItem(SAVES_KEY) || "{}"); return d && typeof d === "object" ? d : {}; } catch { return {}; }
        }
        function writeSave(key, data) {
            const all = readSaves();
            all[key] = { t: Date.now(), d: data };
            Object.keys(all).sort((a, b) => all[b].t - all[a].t).slice(MAX_SAVES).forEach(k => delete all[k]);
            try { localStorage.setItem(SAVES_KEY, JSON.stringify(all)); } catch {}
        }
        // source is copied into game page: use nothing from this page
        function storageBridge(snapJson) {
            const define = (obj, name, desc) => { try { Object.defineProperty(obj, name, { configurable: true, ...desc }); } catch {} };
            const make = (init, onChange) => {
                const d = Object.create(null);
                Object.assign(d, init);
                const api = {
                    getItem: k => (String(k) in d ? d[String(k)] : null),
                    setItem: (k, v) => { d[String(k)] = String(v); onChange(d); },
                    removeItem: k => { delete d[String(k)]; onChange(d); },
                    clear: () => { for (const k in d) delete d[k]; onChange(d); },
                    key: i => Object.keys(d)[i] ?? null
                };
                return new Proxy(api, {
                    get: (t, p) => p === "length" ? Object.keys(d).length : p in t ? t[p] : typeof p === "string" ? d[p] : undefined,
                    set: (t, p, v) => { if (typeof p === "string") api.setItem(p, v); return true; },
                    has: (t, p) => p in t || p in d,
                    deleteProperty: (t, p) => { api.removeItem(p); return true; },
                    ownKeys: () => Object.keys(d),
                    getOwnPropertyDescriptor: (t, p) => p in d ? { value: d[p], enumerable: true, configurable: true, writable: true } : undefined
                });
            };
            let init = {}, timer = 0, latest = null;
            try { init = JSON.parse(snapJson) || {}; } catch {}
            const flush = () => { clearTimeout(timer); if (latest) { try { parent.postMessage({ type: "paroxysm-game-save", data: JSON.stringify(latest) }, "*"); } catch {} latest = null; } };
            const ls = make(init, d => { latest = d; clearTimeout(timer); timer = setTimeout(flush, 400); });
            const ss = make({}, () => {});
            define(window, "localStorage", { get: () => ls });
            define(window, "sessionStorage", { get: () => ss });
            const jar = Object.create(null);
            define(document, "cookie", {
                get: () => Object.keys(jar).map(k => k + "=" + jar[k]).join("; "),
                set: v => { const kv = String(v).split(";")[0], i = kv.indexOf("="); if (i > 0) jar[kv.slice(0, i).trim()] = kv.slice(i + 1).trim(); }
            });
            addEventListener("pagehide", flush);
        }
        function withStorageBridge(html, key) {
            const snap = readSaves()[key]?.d;
            const call = "(" + storageBridge.toString() + ")(" + JSON.stringify(typeof snap === "string" ? snap : "{}").replace(/</g, "\\u003c") + ")";
            const tag = "<script>" + call + "<\/script>";
            const at = /<head[^>]*>/i.exec(html) ?? /^\s*<!doctype[^>]*>/i.exec(html); // after <head> so doctype stays first
            const i = at ? at.index + at[0].length : 0;
            return html.slice(0, i) + tag + html.slice(i);
        }
        let gameFrame = null, gameKey = "";
        addEventListener("message", e => {
            if (gameFrame && e.source === gameFrame.contentWindow && e.data?.type === "paroxysm-game-save" && typeof e.data.data === "string" && e.data.data.length <= MAX_SAVE_CHARS) writeSave(gameKey, e.data.data);
        });

        const sources = { gnmath, lumin };
        let SRC = DEFAULT_SOURCE;
        const src = () => sources[SRC];

        // covers load lazily a few at a time; a task keeps its slot until image loads or fails
        let running = 0; const queue = [];
        function schedule(fn) { queue.push(fn); pump(); }
        function pump() { while (running < 6 && queue.length) { running++; queue.shift()().finally(() => { running--; pump(); }); } }
        async function loadCover(game, img) {
            try {
                const url = await sources[srcOf(game)].cover(game);
                if (!url || !img.isConnected) return; // card already replaced
                await new Promise(done => {
                    const t = setTimeout(done, 20000);
                    const end = () => { clearTimeout(t); done(); };
                    img.onload = () => { img.classList.add("ok"); end(); };
                    img.onerror = end;
                    img.src = url;
                });
            } catch {}
        }
        const seen = "IntersectionObserver" in window ? new IntersectionObserver(entries => {
            for (const e of entries) {
                if (!e.isIntersecting) continue;
                seen.unobserve(e.target);
                const { game, img } = e.target._cover;
                schedule(() => loadCover(game, img));
            }
        }, { rootMargin: "300px" }) : null;

        function favButton(game, cls = "fav") {
            const key = keyOf(game), on = isFav(key);
            return h("button", { class: cls + (on ? " on" : ""), "data-fav": key, title: "Favorite", "aria-label": "Favorite " + game.name, "aria-pressed": String(on),
                onclick: e => { e.stopPropagation(); toggleFav(game); } }, icon("heart"));
        }
        function refreshFavs() {
            document.querySelectorAll("[data-fav]").forEach(b => {
                const on = isFav(b.dataset.fav);
                b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on));
            });
            if (view.mode === "browse") { updateCounts(); if (view.tab === "favorites") renderList(); }
        }
        addEventListener("storage", e => { if (e.key === STORE_KEY) refreshFavs(); });

        function card(game, onOpen = openGame) {
            const img = h("img", { alt: "", decoding: "async" });
            const el = h("div", { class: "g-card", role: "button", tabindex: "0", title: game.name,
                onclick: () => onOpen(game),
                onkeydown: e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onOpen(game); } } },
                h("div", { class: "cover" }, img), favButton(game), h("span", { class: "name", text: game.name }));
            el._cover = { game, img };
            if (seen) seen.observe(el); else schedule(() => loadCover(game, img));
            return el;
        }

        const status = text => h("p", { class: "status", text });
        function failure(message, retry) {
            return h("div", { class: "notice" }, h("h3", { text: "Games couldn't load" }),
                h("p", { text: message + " Check your connection and try again." }),
                h("button", { class: "btn", text: "Try again", onclick: retry }));
        }

        const view = { mode: "browse", tab: "browse", query: "", games: [], total: 0, page: 0, pages: 1, req: 0 };
        const els = {};

        function renderBrowse() {
            view.mode = "browse";
            document.title = "Games"; shell({ type: "paroxysm-title", title: "Games" });
            els.search = h("input", { type: "text", placeholder: "Search games", autocomplete: "off", spellcheck: "false", "aria-label": "Search games" });
            els.search.addEventListener("input", () => { clearTimeout(els.t); els.t = setTimeout(() => { view.query = els.search.value.trim(); if (view.tab === "browse") loadBrowse(true); else { updateCounts(); renderList(); } }, 300); });
            els.src = SOURCE_IDS.map(k => h("button", { type: "button", "data-src": k, text: sources[k].label, onclick: () => setSource(k) }));
            els.seg = ["browse", "recents", "favorites"].map(k => h("button", { "data-tab": k, onclick: () => setTab(k) }));
            els.chip = h("button", { class: "chip-btn on", title: "Library" });
            els.grid = h("div", { class: "grid" });
            els.more = h("div", { class: "more" });
            app.replaceChildren(
                h("div", { class: "g-head", "data-rise": "" }, h("h1", { text: "Games" }),
                    h("div", { class: "seg src", role: "group", "aria-label": "Game source" }, ...els.src)),
                h("label", { class: "g-search", "data-rise": "" }, icon("search"), els.search,
                    h("button", { class: "round-btn", type: "button", title: "Random game", "aria-label": "Random game", onclick: randomGame }, icon("dices"))),
                h("div", { class: "seg", "data-rise": "" }, ...els.seg),
                h("div", { class: "chips", "data-rise": "" }, els.chip),
                els.grid, els.more);
            window.paroxysmRise?.run(app);
            updateCounts();
            renderList();
            src().ready().catch(() => {}); // warm up; loadBrowse shows error
            loadBrowse(true);
        }

        function showFailure(e) {
            els.more.replaceChildren();
            els.grid.replaceChildren(failure(e.message || "Something went wrong.", () => { els.grid.replaceChildren(status("Loading...")); loadBrowse(true); }));
        }

        // picking a source forgets other one's list; choice is remembered
        function setSource(k) {
            if (k === SRC) return;
            SRC = k;
            const s = readStore(); s.source = k; writeStore(s);
            view.req++; view.games = []; view.total = 0; view.page = 0; view.pages = 1; view.loading = false;
            src().ready().catch(() => {});
            updateCounts();
            if (view.tab === "browse") loadBrowse(true); else renderList();
        }

        function setTab(k) { view.tab = k; updateCounts(); if (k === "browse" && !view.games.length) loadBrowse(true); else renderList(); }

        const matches = g => !view.query || g.name.toLowerCase().includes(view.query.toLowerCase());
        const mine = list => list.filter(g => srcOf(g) === SRC);
        function listFor(tab) {
            const s = readStore();
            return mine(tab === "recents" ? s.recents : s.favorites).filter(matches);
        }
        function updateCounts() {
            const s = readStore();
            const label = { browse: "Browse", recents: "Recents", favorites: "Favorites" };
            const count = { browse: 0, recents: mine(s.recents).length, favorites: mine(s.favorites).length };
            els.src.forEach(b => { const on = b.dataset.src === SRC; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); });
            els.seg.forEach(b => {
                const k = b.dataset.tab;
                b.classList.toggle("on", k === view.tab);
                b.replaceChildren(document.createTextNode(label[k]), ...(count[k] ? [h("small", { text: String(count[k]) })] : []));
            });
            const n = view.tab === "browse" ? view.total : listFor(view.tab).length;
            els.chip.replaceChildren(document.createTextNode("Library"), ...(n ? [h("small", { text: String(n) })] : []));
        }

        const loadMoreButton = () => h("button", { class: "btn", text: "Load more", onclick: () => { els.more.replaceChildren(); loadBrowse(false); } });

        function renderList() {
            els.more.replaceChildren();
            if (view.tab === "browse") {
                if (!view.games.length) { els.grid.replaceChildren(status(view.loading ? "Loading..." : (view.query ? "Nothing found." : "Loading..."))); return; }
                els.grid.replaceChildren(...view.games.map(g => card(g)));
                if (view.page < view.pages) els.more.append(loadMoreButton());
                return;
            }
            const list = listFor(view.tab);
            if (!list.length) {
                const empty = view.query ? "Nothing found." : view.tab === "recents" ? "Games you play show up here." : "Tap the heart on a game to keep it here.";
                els.grid.replaceChildren(status(empty)); return;
            }
            els.grid.replaceChildren(...list.map(g => card(g)));
        }

        async function loadBrowse(reset) {
            const req = ++view.req, source = src();
            if (reset) { view.games = []; view.page = 0; view.pages = 1; view.loading = true; if (view.tab === "browse") renderList(); }
            try {
                const r = await source.list({ page: view.page + 1, q: view.query });
                if (req !== view.req) return;
                view.games = reset ? r.games : view.games.concat(r.games);
                view.total = r.total ?? view.games.length; view.page = r.page ?? view.page + 1; view.pages = r.pages ?? 1;
                view.loading = false;
                updateCounts();
                if (view.tab === "browse") {
                    if (reset) renderList(); else { r.games.forEach(g => els.grid.append(card(g))); els.more.replaceChildren(); if (view.page < view.pages) els.more.append(loadMoreButton()); }
                }
            } catch (e) { if (req === view.req) { view.loading = false; if (view.tab === "browse") showFailure(e); } }
        }

        async function randomGame() {
            try { const [g] = await src().random(1); if (g) openGame(g); } catch (e) { showFailure(e); }
        }

        // other games on player page replace this game in same tab
        const openGameHere = g => shell({ type: "newtab-navigate", url: gameUrl(g) }, "games.html" + gameQuery(g));

        const errorText = e => String((e && (e.message || e.error || e.code)) || e || "Unknown error");

        async function renderPlayer(id, sid) {
            view.mode = "player";
            SRC = sid;
            const source = src();
            let game = { id, name: "", s: sid }, iframe = null, slow = 0;
            const overlay = h("div", { class: "loading" });
            const frame = h("div", { class: "frame" }, overlay);
            const title = h("div", { class: "pl-title", text: "Loading..." });
            const favBtn = h("button", { class: "round-btn fav-btn" + (isFav(keyOf(game)) ? " on" : ""), "data-fav": keyOf(game), title: "Favorite", "aria-label": "Favorite", "aria-pressed": String(isFav(keyOf(game))), onclick: () => toggleFav(game) }, icon("heart"));
            const reloadBtn = h("button", { class: "round-btn", title: "Reload game", "aria-label": "Reload game", onclick: () => start() }, icon("rotate-cw"));
            const fsBtn = h("button", { class: "round-btn", title: "Fullscreen", "aria-label": "Fullscreen", onclick: () => { document.fullscreenElement ? document.exitFullscreen() : frame.requestFullscreen?.(); } }, icon("maximize"));
            const sideL = h("div", { class: "side" }), sideR = h("div", { class: "side" });
            const more = h("div", { class: "grid" });
            app.replaceChildren(
                h("div", { class: "pl-top" },
                    h("button", { class: "btn", onclick: goGames }, icon("arrow-left"), h("span", { text: "Back" })),
                    title, favBtn, reloadBtn, fsBtn),
                h("div", { class: "stage" }, sideL, frame, sideR),
                h("h2", { class: "sub", text: "More games" }), more);
            document.addEventListener("fullscreenchange", () => {
                const full = document.fullscreenElement === frame;
                fsBtn.replaceChildren(icon(full ? "minimize" : "maximize"));
                fsBtn.title = full ? "Exit fullscreen" : "Fullscreen";
                fsBtn.setAttribute("aria-label", fsBtn.title);
            });

            const say = (heading, text, withRetry) => {
                overlay.hidden = false;
                overlay.replaceChildren(h("div", { class: "notice" }, h("h3", { text: heading }), h("p", { text }),
                    h("p", { class: "hint", text: "Game: " + id }),
                    withRetry ? h("button", { class: "btn", text: "Try again", onclick: () => start() }) : null));
            };

            async function start() {
                clearTimeout(slow);
                overlay.hidden = false;
                overlay.replaceChildren(document.createTextNode("Loading game..."));
                try {
                    const res = await source.play(id);
                    game = { id, name: res.meta?.name || id, category: res.meta?.category || "", s: sid };
                    title.textContent = game.name;
                    document.title = game.name; shell({ type: "paroxysm-title", title: game.name });
                    pushRecent(game);
                    iframe?.remove();
                    iframe = h("iframe", { title: game.name, allow: "autoplay; fullscreen; pointer-lock; gamepad", allowfullscreen: "" });
                    iframe.addEventListener("load", () => { clearTimeout(slow); overlay.hidden = true; });
                    if (res.html != null) { // third-party page: opaque origin with storage bridge
                        gameFrame = iframe; gameKey = keyOf(game);
                        iframe.setAttribute("sandbox", GAME_SANDBOX);
                        iframe.srcdoc = withStorageBridge(res.html, gameKey);
                    }
                    else iframe.src = res.url;
                    frame.prepend(iframe);
                    slow = setTimeout(() => say("Still loading", res.html != null ? "The game is taking a long time. You can reload it." : "The game is taking a long time. You can ask for a fresh link.", true), 20000);
                } catch (e) {
                    console.error("[paroxysm] game failed to load:", sid, id, e);
                    say("This game couldn't load", errorText(e), true);
                    return;
                }
                if (!sideL.children.length) { // other games after game started
                    try {
                        const others = (await source.random(18)).filter(g => g.id !== id);
                        others.slice(0, 8).forEach((g, i) => (i % 2 ? sideR : sideL).append(card(g, openGameHere)));
                        others.slice(8).forEach(g => more.append(card(g, openGameHere)));
                    } catch (e) { console.error("[paroxysm] other games failed to load:", e); }
                }
            }
            start();
        }

        const params = new URLSearchParams(location.search);
        const param = params.get("g");
        if (param) {
            // any id is fine: only passed to source and shown as text
            // no s= means LuminSDK (pre-picker link)
            if (param.length <= 300) renderPlayer(param, params.get("s") === "gnmath" ? "gnmath" : "lumin");
            else app.replaceChildren(h("div", { class: "notice" }, h("h3", { text: "That game link isn't valid" }), h("button", { class: "btn", text: "Back to games", onclick: goGames })));
        } else { SRC = readStore().source; renderBrowse(); }
    </script>
</body>
