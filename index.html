    <script src="paroxysm.config.js"></script>
    <script src="paroxysm-cloak.js"></script>
    <script src="scramjet/scramjet.js"></script>
    <script src="controller/controller.api.js"></script>
    <script src="epoxy/index.js"></script>
    <script src="paroxysm-transport.js"></script>

    <script>
        const { Controller } = $scramjetController;
        const { defaultConfig } = $scramjet;
        const EpoxyTransport = self.EpoxyTransport.default;

        //── Wisp servers ───────────────────────────────────────────────────────
        // The built-in list lives in paroxysm.config.js, encoded (see encode_wisp.py), and is shown in
        // the UI as "Wisp Server 1", "Wisp Server 2", ... Servers the user adds in Settings > Proxy
        // are kept in the settings and shown as "Custom Server 1", ... Ordered fallback: the picked
        // server (if any) is tried first, then the rest in order. The UI never shows the URLs.
        const decodeWisp = s => { try { return atob(s).split("").reverse().join(""); } catch { return ""; } };
        const BUILTIN_WISP = (window.PAROXYSM_CONFIG?.wispServers ?? []).map(decodeWisp).filter(Boolean);
        const WISP_SERVERS = [];          // { id, name, url, custom }; init() reads WISP_SERVERS[activeServerIdx].url
        let activeServerIdx = 0;
        let activeServerId = null;

        function rebuildServers() {
            const custom = (paroxysmSettings.get().customWisp ?? []).filter(u => /^wss?:\/\/\S+$/i.test(u));
            WISP_SERVERS.length = 0;
            BUILTIN_WISP.forEach((url, i) => WISP_SERVERS.push({ id: "b" + i, name: "Wisp Server " + (i + 1), url, custom: false }));
            custom.forEach((url, i) => WISP_SERVERS.push({ id: "c" + i, name: "Custom Server " + (i + 1), url, custom: true }));
            const at = WISP_SERVERS.findIndex(x => x.id === activeServerId);
            if (at >= 0) activeServerIdx = at;
        }
        rebuildServers();

        const LOCAL_SCHEME     = "paroxysm://";
        // Local pages. "newtab" stays as an accepted alias for home.
        const LOCAL_ROUTES = {
            home:     { file: "newtab.html",   title: "Home",     icon: "house" },
            games:    { file: "games.html",    title: "Games",    icon: "gamepad-2" },
            ai:       { file: "ai.html",       title: "AI",       icon: "bot" },
            settings: { file: "settings.html", title: "Settings", icon: "settings" }
        };
        const HOME_URL         = LOCAL_SCHEME + "home";
        const SETTINGS_URL     = LOCAL_SCHEME + "settings";

        const tabBar        = document.getElementById("tabBar");
        const newTabBtn     = document.getElementById("newTabBtn");
        const framesEl      = document.getElementById("frames");
        const urlInput      = document.getElementById("urlInput");
        const urlIconUse    = document.getElementById("urlIconUse");
        const pillEl        = document.getElementById("pill");
        const railLinks     = document.getElementById("railLinks");

        let scramjet = null;
        let ready = false;

        // ── Notifications ──────────────────────────────────────────────────────
        // A small pill, shown only when there is something to report.
        // There is no permanent connection indicator.
        let pillTimer = null;

        function showPill(kind, message, ms = 3500) {
            clearTimeout(pillTimer);
            pillEl.className = "pill show " + kind;
            pillEl.textContent = message;
            if (ms) pillTimer = setTimeout(hidePill, ms);
        }

        function hidePill() {
            clearTimeout(pillTimer);
            pillEl.classList.remove("show");
        }
        window.paroxysmPill = showPill;     // used by paroxysm-transport.js

        // ── Status ─────────────────────────────────────────────────────────────
        // init() still reports through setStatus(); only problems are surfaced.
        const STATUS_TEXT = {
            "Not ready, wait...": "Can't reach a wisp server. Retrying…",
            "Transport failed":   "The network transport failed to start."
        };

        function setStatus(state, message) {
            if (state === "warn")       showPill("warn", STATUS_TEXT[message] ?? message, 0); // stays while retrying
            else if (state === "error") showPill("error", STATUS_TEXT[message] ?? message, 10000);
            else                        hidePill();                                          // connecting / ready
        }

        // ── Wisp server selection ──────────────────────────────────────────────
        // WISP_SERVERS is an ordered fallback list: the first endpoint that accepts a
        // connection wins. init() is not modified; it is wrapped below so the endpoint is
        // chosen before it runs, then init() probes and uses that endpoint exactly as before.
        const PROBE_CAP_MS = 5000;

        function probeWithin(url, ms) {
            return Promise.race([
                probeWisp(url),
                new Promise((_, reject) => setTimeout(() => reject(new Error("Timed out")), ms))
            ]);
        }

        // The order to try servers in: the picked one first (if any), then the rest in list order.
        function serverOrder(auto) {
            const all = WISP_SERVERS.map((_, i) => i);
            const pick = auto ? -1 : WISP_SERVERS.findIndex(x => x.id === paroxysmSettings.get().wispPreferred);
            return pick > 0 ? [pick, ...all.filter(i => i !== pick)] : all;
        }

        // Index of the first reachable server. Retries forever unless `once` is set (then -1).
        // `auto` ignores the picked server (used by "Find best server").
        async function findWispServer(once = false, auto = false) {
            if (!WISP_SERVERS.length) {
                setStatus("error", "No wisp servers are configured (see paroxysm.config.js).");
                return once ? -1 : new Promise(() => {});
            }
            while (true) {
                const order = serverOrder(auto);
                for (const i of order) {
                    try {
                        await probeWithin(WISP_SERVERS[i].url, PROBE_CAP_MS);
                        if (!auto && i !== order[0] && paroxysmSettings.get().wispPreferred) {
                            showPill("warn", `${WISP_SERVERS[order[0]].name} is unavailable. Using ${WISP_SERVERS[i].name}.`, 5000);
                        }
                        return i;
                    } catch (e) {
                        console.error(`[paroxysm] wisp server ${i + 1}/${WISP_SERVERS.length} unavailable:`, e);
                    }
                }
                if (once) return -1;
                setStatus("warn", "Not ready, wait...");
                await new Promise(r => setTimeout(r, 2000));
            }
        }

        const initWithServer = init;
        init = async function () {
            activeServerIdx = await findWispServer();
            activeServerId = WISP_SERVERS[activeServerIdx]?.id ?? null;
            return initWithServer();
        };

        // ── Settings API ───────────────────────────────────────────────────────
        // settings.html (same origin) reads and drives the proxy through this object.
        async function checkConnection() {
            const srv = WISP_SERVERS[activeServerIdx];
            if (!srv) { showPill("warn", "No wisp server is configured.", 4000); return false; }
            const t0 = performance.now();
            try {
                await probeWisp(srv.url);
                showPill("ok", `${srv.name} is reachable (${Math.round(performance.now() - t0)} ms)`);
                return true;
            } catch (e) {
                showPill("warn", `Can't reach ${srv.name}: ${e.message}`, 6000);
                return false;
            }
        }

        // Probe every endpoint at once and report each result.
        function testAll() {
            return Promise.all(WISP_SERVERS.map(async s => {
                const t0 = performance.now();
                try {
                    await probeWisp(s.url);
                    return { id: s.id, name: s.name, ok: true, ms: Math.round(performance.now() - t0) };
                } catch (e) {
                    return { id: s.id, name: s.name, ok: false, error: e.message };
                }
            }));
        }

        // Re-run the ordered search; switch only if a better (earlier) endpoint is available.
        async function findBestServer() {
            const idx = await findWispServer(true, true);
            if (idx === -1) { showPill("warn", "No wisp server responded.", 5000); return false; }
            paroxysmSettings.set({ wispPreferred: "" });          // back to automatic
            if (idx === activeServerIdx && ready) {
                showPill("ok", `Already on the best available server (${WISP_SERVERS[idx].name})`);
                return true;
            }
            scramjet = null;
            ready = false;
            init();
            return true;
        }

        // Use a server the user picked. It is checked first, so a dead one never leaves you offline.
        async function selectServer(i) {
            const srv = WISP_SERVERS[i];
            if (!srv) return false;
            if (i === activeServerIdx && ready) {
                paroxysmSettings.set({ wispPreferred: srv.id });
                showPill("ok", `Already using ${srv.name}`);
                return true;
            }
            try {
                await probeWithin(srv.url, PROBE_CAP_MS);
            } catch (e) {
                showPill("warn", `Can't reach ${srv.name}. Staying on the current server.`, 5000);
                return false;
            }
            paroxysmSettings.set({ wispPreferred: srv.id });
            scramjet = null;
            ready = false;
            init();
            return true;
        }

        // Servers the user adds (kept in settings; shown as "Custom Server N").
        function addCustomServer(input) {
            const url = String(input ?? "").trim();
            if (!/^wss?:\/\/\S+$/i.test(url)) return { ok: false, error: "That needs to start with wss:// (or ws://) and have no spaces." };
            if (WISP_SERVERS.some(x => x.url === url)) return { ok: false, error: "That server is already in the list." };
            paroxysmSettings.set({ customWisp: [...(paroxysmSettings.get().customWisp ?? []), url] });
            rebuildServers();
            return { ok: true };
        }

        function removeCustomServer(index) {
            const srv = WISP_SERVERS[index];
            if (!srv?.custom) return { ok: false, error: "Built-in servers can't be removed." };
            if (index === activeServerIdx && ready) return { ok: false, error: "That server is in use. Pick another one first." };
            const s = paroxysmSettings.get();
            paroxysmSettings.set({
                customWisp: (s.customWisp ?? []).filter(u => u !== srv.url),
                wispPreferred: s.wispPreferred === srv.id ? "" : s.wispPreferred
            });
            rebuildServers();
            return { ok: true };
        }

        window.paroxysm = {
            servers:     () => WISP_SERVERS.map(s => ({ id: s.id, name: s.name, custom: s.custom })),   // never the URLs
            activeIndex: () => activeServerIdx,
            isReady:     () => ready,
            checkConnection,
            testAll,
            findBestServer,
            selectServer,
            addCustomServer,
            removeCustomServer,
            about: () => ({
                version:    window.PAROXYSM_CONFIG?.version ?? "dev",
                scramjet:   self.$scramjet?.versionInfo?.version ?? "unknown",
                controller: self.$scramjetController?.versionInfo?.version ?? "unknown"
            })
        };

        // ── Helpers ────────────────────────────────────────────────────────────
        function norm(u) {
            if (!u) return "https://example.com";
            return u.startsWith("http") ? u : "https://" + u;
        }

        function isUrl(str) {
            return /^[^\s]+\.[^\s]+/.test(str) || str.startsWith("http");
        }

        function resolveInput(input) {
            if (!input.trim()) return null;
            if (isUrl(input)) return norm(input);
            return paroxysmSettings.searchUrl(input);
        }

        function getDomain(url) {
            try { return new URL(url).hostname; } catch { return null; }
        }

        function getFaviconUrl(url) {
            const domain = getDomain(url);
            if (!domain) return null;
            return `https://www.google.com/s2/favicons?domain=${domain}&sz=16`;
        }

        // Local pages (Settings, Games, ...) are real tabs: focus one if it is already open, otherwise open one.
        function openLocal(url) {
            const norm = u => (!u || u === "newtab") ? HOME_URL : u;     // a new tab is stored as "newtab" internally
            const existing = tabs.find(t => norm(t.url) === norm(url));
            if (existing) { switchTab(existing.id); return; }
            createTab();
            go(url);
        }
        const openPage = key => openLocal(LOCAL_SCHEME + key);

        // Sidebar links, in the order chosen in Settings > Appearance > Sidebar.
        function renderRailLinks() {
            railLinks.replaceChildren(...paroxysmSettings.sidebarOrder().map(key => {
                const r = LOCAL_ROUTES[key];
                const b = document.createElement("button");
                b.className = "rail-link";
                b.title = r.title;
                b.innerHTML = `<svg class="icon" aria-hidden="true"><use href="#i-${r.icon}"/></svg><span>${r.title}</span>`;
                b.addEventListener("click", () => openPage(key));
                return b;
            }));
        }

        // The proxied URL follows "<origin><controller prefix><id>/<frame id>/".
        // The prefix comes from the controller's own config instead of being hard-coded.
        function proxiedUrlPattern() {
            const prefix = $scramjetController.config?.prefix ?? "/~/sj/";
            const escaped = prefix.replace(/[.*+?^${}()|[\]\\\/]/g, "\\$&");
            return new RegExp("https?:\\/\\/[^/]+" + escaped + "[^/]+\\/[^/]+\\/(https?.+)");
        }

        // Lucide icon for a page: home and settings have their own, everything else a globe.
        // Used for the tab icon (until a site's favicon loads) and for the icon in the address bar.
        function routeKeyFor(url) {
            if (!url || url === "newtab") return "home";
            if (!url.startsWith(LOCAL_SCHEME)) return null;
            let page = url.slice(LOCAL_SCHEME.length).split(/[/?#]/)[0];
            if (page === "newtab") page = "home";
            return LOCAL_ROUTES[page] ? page : null;
        }

        function iconNameFor(url) {
            const key = routeKeyFor(url);
            return key ? LOCAL_ROUTES[key].icon : "globe";
        }

        function syncOmnibox(tab) {
            urlIconUse.setAttribute("href", "#i-" + iconNameFor(tab?.url));
            syncBookmarkBtn();     // tab.url has just changed
        }

        function setTabIcon(tab, name) {
            if (!tab.tabEl) return;
            tab.tabEl.classList.add("local");
            tab.iconUse.setAttribute("href", "#i-" + name);
        }

        function getActiveTab() {
            return tabs.find(t => t.id === activeTabId) ?? null;
        }

        // ── Tab rendering ──────────────────────────────────────────────────────
        function renderTab(tab) {
            const el = document.createElement("div");
            el.className = "tab" + (tab.id === activeTabId ? " active" : "");
            el.dataset.id = tab.id;

            // Two icon slots: a site favicon (img) or a Lucide icon (svg). Home and settings, and
            // sites whose favicon lookup fails, show the Lucide icon; the paroxysm logo is never used.
            const favicon = document.createElement("img");
            favicon.className = "tab-favicon";
            favicon.alt = "";
            favicon.onerror = () => setTabIcon(tab, "globe");   // lookup blocked or failed

            const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            icon.setAttribute("class", "icon tab-icon");
            icon.setAttribute("aria-hidden", "true");
            const iconUse = document.createElementNS("http://www.w3.org/2000/svg", "use");
            icon.appendChild(iconUse);

            const title = document.createElement("span");
            title.className = "tab-title";
            title.textContent = tab.title || "Home";

            const closeBtn = document.createElement("span");
            closeBtn.className = "tab-close";
            closeBtn.innerHTML = `<svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>`;
            closeBtn.title = "Close tab";
            closeBtn.addEventListener("click", e => {
                e.stopPropagation();
                closeTab(tab.id);
            });

            el.appendChild(favicon);
            el.appendChild(icon);
            el.appendChild(title);
            el.appendChild(closeBtn);
            el.addEventListener("click", () => switchTab(tab.id));

            tab.tabEl = el;
            tab.faviconEl = favicon;
            tab.iconUse = iconUse;
            tabBar.insertBefore(el, newTabBtn.parentNode === tabBar ? newTabBtn : null);   // the New tab button lives in the top bar in horizontal layout
            setTabIcon(tab, iconNameFor(tab.url));
        }

        function updateTabTitle(tab, title) {
            tab.title = title;
            if (tab.tabEl) tab.tabEl.querySelector(".tab-title").textContent = title;
        }

        function updateTabFavicon(tab, url) {
            if (!tab.faviconEl) return;
            const faviconUrl = getFaviconUrl(url);
            if (!faviconUrl) return;
            tab.tabEl?.classList.remove("local");
            tab.faviconEl.src = faviconUrl;
        }

        function syncTabBarActive() {
            tabs.forEach(t => t.tabEl?.classList.toggle("active", t.id === activeTabId));
        }

        // ── Tab lifecycle ──────────────────────────────────────────────────────
        const tabs = [];
        let activeTabId = null;
        let nextTabId   = 0;

        // Frames start hidden and fade in once they have loaded; they hide again as soon as the page
        // inside starts to unload (refresh, link click). That way the gap between two pages shows the
        // paroxysm colour instead of the browser's white. Nothing here touches the proxy engine.
        function watchFrame(tab) {
            const f = tab.iframe;
            let safety = 0;
            const show = () => { clearTimeout(safety); f.classList.add("shown"); };
            const hide = () => {
                f.classList.remove("shown");
                clearTimeout(safety);
                safety = setTimeout(show, 6000);          // never stay hidden if a load event is missed
            };
            f.addEventListener("load", () => {
                if (tab.frame && recentlyRevived() && !servedByProxy(f.contentWindow) && (tab.reviveRetries = (tab.reviveRetries ?? 0) + 1) <= 2) {
                    try { f.contentWindow.location.reload(); return; } catch {}   // loaded while the service worker had no route yet
                }
                tab.reviveRetries = 0;
                f.classList.toggle("web", !!tab.frame);   // proxied sites get a white canvas, local pages don't
                try { f.contentWindow.addEventListener("pagehide", hide); } catch {}
                try { paroxysmCloak.watchWindow(f.contentWindow, !!tab.frame); } catch {}   // panic key, character masking
                show();
            });
        }

        function createTab(url = null) {
            const id = nextTabId++;
            const iframe = document.createElement("iframe");
            iframe.title = "paroxysm";
            framesEl.appendChild(iframe);

            const tab = { id, iframe, frame: null, url: url || "newtab", title: "Home", tabEl: null, faviconEl: null, iconUse: null, _pollInterval: null };
            tabs.push(tab);
            watchFrame(tab);

            renderTab(tab);
            switchTab(id);

            if (url && ready) {
                attachFrame(tab, url);
            } else if (!url) {
                iframe.src = "newtab.html";
            }

            return tab;
        }

        function attachFrame(tab, url) {
            tab.frame = scramjet.createFrame(tab.iframe);
            tab.url = norm(url);
            tab.frame.go(tab.url);
            updateTabTitle(tab, tab.url);
            updateTabFavicon(tab, tab.url);

            if (tab._pollInterval) clearInterval(tab._pollInterval);
            tab._pollInterval = setInterval(() => {
                try {
                    const doc = tab.iframe.contentDocument;
                    const win = tab.iframe.contentWindow;
                    if (!doc || !win) return;

                    const raw = win.location.href;
                    if (raw && raw !== "about:blank") {
                        const match = raw.match(proxiedUrlPattern());
                        const realUrl = match ? decodeURIComponent(match[1].split("?")[0]) : raw;
                        if (realUrl !== tab.url) {
                            tab.url = realUrl;
                            updateTabFavicon(tab, realUrl);
                            if (tab.id === activeTabId) urlInput.value = realUrl;
                        }
                    }

                    const title = doc.title;
                    if (title && title !== "Just a moment..." && title !== tab.title) {
                        updateTabTitle(tab, title);
                    }
                } catch {}
            }, 500);
        }

        function switchTab(id) {
            activeTabId = id;
            tabs.forEach(t => t.iframe.classList.toggle("active", t.id === id));
            syncTabBarActive();
            const tab = getActiveTab();
            if (tab) {
                urlInput.value = tab.url === "newtab" ? HOME_URL : (tab.url || "");
                syncOmnibox(tab);
            }
        }

        function closeTab(id) {
            const idx = tabs.findIndex(t => t.id === id);
            if (idx === -1) return;
            const tab = tabs[idx];
            clearInterval(tab._pollInterval);
            tab.iframe.remove();
            tab.tabEl?.remove();
            tabs.splice(idx, 1);
            if (tabs.length === 0) { createTab(); return; }
            if (activeTabId === id) switchTab(tabs[Math.min(idx, tabs.length - 1)].id);
        }

        // ── Navigation ─────────────────────────────────────────────────────────
        function go(input) {
            const tab = getActiveTab();
            if (!tab) return;

            if (input.startsWith(LOCAL_SCHEME)) {
                const page = routeKeyFor(input);
                if (!page) return;
                const route = LOCAL_ROUTES[page];
                const rest = input.slice(LOCAL_SCHEME.length);
                const query = rest.includes("?") ? rest.slice(rest.indexOf("?")).split("#")[0] : "";   // e.g. ?g=game-id
                clearInterval(tab._pollInterval);
                tab._pollInterval = null;
                tab.frame = null;
                tab.url = LOCAL_SCHEME + page + query;
                urlInput.value = tab.url;
                updateTabTitle(tab, route.title);
                setTabIcon(tab, route.icon);
                syncOmnibox(tab);
                tab.iframe.src = route.file + query;
                return;
            }

            const url = resolveInput(input);
            if (!url) return;
            urlInput.value = url;
            tab.url = url;
            updateTabTitle(tab, url);
            updateTabFavicon(tab, url);
            syncOmnibox(tab);
            if (!tab.frame) {
                if (!ready) {
                    showPill("warn", "Still connecting. The page will load once a wisp server is ready.", 4000);
                    return;
                }
                attachFrame(tab, url);
            } else {
                tab.frame.go(url);
            }
        }

        urlInput.addEventListener("keydown", e => { if (e.key === "Enter") go(urlInput.value); });
        document.getElementById("backBtn").onclick    = () => getActiveTab()?.iframe?.contentWindow?.history.back();
        document.getElementById("forwardBtn").onclick = () => getActiveTab()?.iframe?.contentWindow?.history.forward();
        document.getElementById("reloadBtn").onclick  = () => getActiveTab()?.iframe?.contentWindow?.location.reload();
        newTabBtn.onclick = () => createTab();

        renderRailLinks();
        paroxysmCloak.init();
        paroxysmSettings.onChange(() => { renderRailLinks(); rebuildServers(); syncBrand(); renderMarks(); });

        // sidebar: collapse to icons (remembered)
        const RAIL_KEY = "paroxysm:rail-collapsed";
        function setRailCollapsed(on) {
            document.body.classList.toggle("rail-collapsed", on);
            try { localStorage.setItem(RAIL_KEY, on ? "1" : "0"); } catch {}
        }
        try { if (localStorage.getItem(RAIL_KEY) === "1") setRailCollapsed(true); } catch {}
        document.getElementById("railToggle").addEventListener("click",
            () => setRailCollapsed(!document.body.classList.contains("rail-collapsed")));

        // sidebar: drag the handle to resize (double-click resets), width is remembered
        const RAIL_W_KEY = "paroxysm:rail-width", RAIL_W_MIN = 160, RAIL_W_MAX = 360;
        function setRailWidth(px, save = true) {
            if (px == null) document.body.style.removeProperty("--rail-w");
            else document.body.style.setProperty("--rail-w", Math.min(RAIL_W_MAX, Math.max(RAIL_W_MIN, Math.round(px))) + "px");
            if (save) try { px == null ? localStorage.removeItem(RAIL_W_KEY) : localStorage.setItem(RAIL_W_KEY, String(Math.round(px))); } catch {}
        }
        try { const w = Number(localStorage.getItem(RAIL_W_KEY)); if (w) setRailWidth(w, false); } catch {}

        const resizer = document.getElementById("railResizer");
        let resizing = false, lastDown = 0;
        resizer.addEventListener("pointerdown", e => {
            const now = performance.now();
            if (now - lastDown < 350) { lastDown = 0; setRailWidth(null); return; }   // quick second press = reset
            lastDown = now;
            resizing = true;
            resizer.setPointerCapture(e.pointerId);
            document.body.classList.add("resizing");
        });
        resizer.addEventListener("pointermove", e => { if (resizing) setRailWidth(e.clientX, false); });
        const endResize = e => {
            if (!resizing) return;
            resizing = false;
            document.body.classList.remove("resizing");
            const w = parseInt(getComputedStyle(document.body).getPropertyValue("--rail"), 10);
            if (w) setRailWidth(w);
        };
        resizer.addEventListener("pointerup", endResize);
        resizer.addEventListener("pointercancel", endResize);

        // ── Layout: horizontal tabs (default) or the sidebar ───────────────────
        const LAYOUT_KEY   = "paroxysm:layout";
        const tabStrip     = document.getElementById("tabStrip");
        const toolbarRight = document.querySelector(".toolbar-right");
        const railEl       = document.querySelector(".rail");
        const layoutBtn    = document.getElementById("layoutBtn");

        function setLayout(mode, save = true) {
            const horizontal = mode !== "v";
            document.body.classList.toggle("layout-h", horizontal);
            document.body.classList.toggle("layout-v", !horizontal);
            if (horizontal) { tabStrip.append(tabBar); toolbarRight.prepend(newTabBtn); }
            else { railEl.prepend(tabBar); tabBar.append(newTabBtn); }
            layoutBtn.querySelector("use").setAttribute("href", horizontal ? "#i-panel-left" : "#i-panel-top");
            layoutBtn.title = horizontal ? "Switch to sidebar tabs" : "Switch to horizontal tabs";
            layoutBtn.setAttribute("aria-label", layoutBtn.title);
            if (save) try { localStorage.setItem(LAYOUT_KEY, horizontal ? "h" : "v"); } catch {}
        }
        layoutBtn.addEventListener("click", () => setLayout(document.body.classList.contains("layout-h") ? "v" : "h"));
        try { setLayout(localStorage.getItem(LAYOUT_KEY) === "v" ? "v" : "h", false); } catch { setLayout("h", false); }

        // The paroxysm icon at the top left follows the theme (dark-mode or light-mode file).
        const brandImg = document.getElementById("brandImg");
        function syncBrand() {
            brandImg.src = `assets/paroxysm/paroxysm_${paroxysmSettings.get().theme === "light" ? "lightmode" : "darkmode"}_icon.png`;
        }
        syncBrand();
        document.getElementById("brandBtn").addEventListener("click", () => openPage("home"));

        // ── Omnibox: cosmetic colouring of the address ─────────────────────────
        // The input always holds the full, real address; Scramjet and everything else read that.
        // While the field is not being edited, a coloured copy is shown on top: no https://, the domain
        // bright and the path, query and hash gray. Focusing the field shows the real text again.
        const urlField   = document.getElementById("urlField");
        const urlDisplay = document.getElementById("urlDisplay");
        function renderUrlDisplay() {
            urlDisplay.replaceChildren();
            urlField.classList.remove("styled");
            const v = urlInput.value;
            if (!v || document.activeElement === urlInput) return;
            let u;
            try { u = new URL(v); } catch { return; }
            let rest = u.pathname + u.search + u.hash;
            if (rest === "/") rest = "";
            if (u.protocol !== "http:" && u.protocol !== "https:") urlDisplay.append(document.createTextNode(u.protocol + "//"));
            const host = document.createElement("b");
            host.textContent = u.host;
            urlDisplay.append(host);
            if (rest) urlDisplay.append(document.createTextNode(rest));
            urlField.classList.add("styled");
        }
        // Code elsewhere sets urlInput.value directly (including the protected frame code); catch every change.
        const valueDesc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value");
        Object.defineProperty(urlInput, "value", {
            configurable: true,
            get() { return valueDesc.get.call(this); },
            set(v) { valueDesc.set.call(this, v); renderUrlDisplay(); syncBookmarkBtn(); }
        });
        urlInput.addEventListener("focus", () => { renderUrlDisplay(); urlInput.select(); });
        urlInput.addEventListener("blur", renderUrlDisplay);

        // ── Small helpers: a context menu and a form dialog ────────────────────
        let ctxEl = null;
        function closeCtx() { ctxEl?.remove(); ctxEl = null; }
        function showCtx(x, y, items) {
            closeCtx();
            ctxEl = document.createElement("div");
            ctxEl.className = "ctx";
            items.forEach(([label, fn]) => {
                const b = document.createElement("button");
                b.textContent = label;
                b.addEventListener("click", () => { closeCtx(); fn(); });
                ctxEl.append(b);
            });
            document.body.append(ctxEl);
            ctxEl.style.left = Math.min(x, innerWidth - ctxEl.offsetWidth - 8) + "px";
            ctxEl.style.top = Math.min(y, innerHeight - ctxEl.offsetHeight - 8) + "px";
        }
        addEventListener("pointerdown", e => { if (ctxEl && !ctxEl.contains(e.target)) closeCtx(); }, true);
        addEventListener("keydown", e => { if (e.key === "Escape") closeCtx(); });

        // Returns the typed value, or null if cancelled.
        function askText(title, label, value) {
            return new Promise(resolve => {
                const back = document.createElement("div");
                back.className = "modal-back";
                const box = document.createElement("div");
                box.className = "modal";
                box.innerHTML = `<h3></h3><label class="field"><span></span><input class="text-input" type="text" autocomplete="off" spellcheck="false"></label>
                    <div class="actions"><button class="btn" data-x="cancel">Cancel</button><button class="btn primary" data-x="ok">Save</button></div>`;
                box.querySelector("h3").textContent = title;
                box.querySelector("span").textContent = label;
                const input = box.querySelector("input");
                input.value = value ?? "";
                const done = v => { back.remove(); resolve(v); };
                box.querySelector('[data-x="cancel"]').onclick = () => done(null);
                box.querySelector('[data-x="ok"]').onclick = () => done(input.value.trim());
                input.addEventListener("keydown", e => { if (e.key === "Enter") done(input.value.trim()); if (e.key === "Escape") done(null); });
                back.addEventListener("pointerdown", e => { if (e.target === back) done(null); });
                back.append(box);
                document.body.append(back);
                input.focus(); input.select();
            });
        }

        // ── Bookmarks ──────────────────────────────────────────────────────────
        const MARKS_KEY    = "paroxysm:bookmarks";
        const marksBar     = document.getElementById("marksBar");
        const bookmarkBtn  = document.getElementById("bookmarkBtn");
        const readMarks = () => { try { const a = JSON.parse(localStorage.getItem(MARKS_KEY) || "[]"); return Array.isArray(a) ? a : []; } catch { return []; } };
        function writeMarks(list) { try { localStorage.setItem(MARKS_KEY, JSON.stringify(list)); } catch {} renderMarks(); syncBookmarkBtn(); }
        const normUrl = u => { try { return new URL(u).href; } catch { return String(u); } };

        // The address of the page in the active tab ("" for Home, which is not bookmarked).
        function currentPageUrl() {
            const t = getActiveTab();
            const v = urlInput.value.trim();
            if (!t || !v || t.url === "newtab" || v === HOME_URL) return "";
            return v;
        }
        function syncBookmarkBtn() {
            const url = currentPageUrl();
            const has = !!url && readMarks().some(m => normUrl(m.url) === normUrl(url));
            bookmarkBtn.disabled = !url;
            bookmarkBtn.classList.toggle("on", has);
            bookmarkBtn.title = has ? "Remove bookmark" : "Bookmark this page";
        }
        bookmarkBtn.addEventListener("click", () => {
            const url = currentPageUrl();
            if (!url) return;
            const list = readMarks();
            const at = list.findIndex(m => normUrl(m.url) === normUrl(url));
            if (at >= 0) { list.splice(at, 1); writeMarks(list); return; }
            const t = getActiveTab();
            let title = t?.title;
            if (!title || title === url || title === t.url) { try { title = new URL(url).host; } catch { title = url; } }
            list.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: title.slice(0, 80), url });
            writeMarks(list);
        });

        function openMark(m, newTab) {
            if (newTab) createTab();
            go(m.url);
        }

        let dragMarkId = null;
        function renderMarks() {
            const list = readMarks();
            marksBar.classList.toggle("show", list.length > 0 && paroxysmSettings.get().bookmarksBar !== false);
            marksBar.replaceChildren(...list.map(m => {
                const b = document.createElement("button");
                b.className = "mark";
                b.draggable = true;
                b.title = m.title + "\n" + m.url;
                const fav = getFaviconUrl(m.url);
                const lucide = name => { const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("class", "icon"); svg.setAttribute("aria-hidden", "true"); const use = document.createElementNS("http://www.w3.org/2000/svg", "use"); use.setAttribute("href", "#i-" + name); svg.append(use); return svg; };
                if (fav) { const i = document.createElement("img"); i.alt = ""; i.src = fav; i.onerror = () => i.replaceWith(lucide("globe")); b.append(i); }
                else b.append(lucide(iconNameFor(m.url)));
                const label = document.createElement("span");
                label.textContent = m.title;
                b.append(label);
                b.addEventListener("click", e => openMark(m, e.ctrlKey || e.metaKey));
                b.addEventListener("auxclick", e => { if (e.button === 1) { e.preventDefault(); openMark(m, true); } });
                b.addEventListener("contextmenu", e => {
                    e.preventDefault();
                    showCtx(e.clientX, e.clientY, [
                        ["Open in new tab", () => openMark(m, true)],
                        ["Rename", async () => { const t = await askText("Rename bookmark", "Name", m.title); if (t) writeMarks(readMarks().map(x => x.id === m.id ? { ...x, title: t.slice(0, 80) } : x)); }],
                        ["Delete", () => writeMarks(readMarks().filter(x => x.id !== m.id))]
                    ]);
                });
                b.addEventListener("dragstart", e => { dragMarkId = m.id; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", m.id); });
                b.addEventListener("dragover", e => { if (dragMarkId && dragMarkId !== m.id) { e.preventDefault(); b.classList.add("over"); } });
                b.addEventListener("dragleave", () => b.classList.remove("over"));
                b.addEventListener("drop", e => {
                    e.preventDefault(); b.classList.remove("over");
                    if (!dragMarkId || dragMarkId === m.id) return;
                    const cur = readMarks();
                    const from = cur.findIndex(x => x.id === dragMarkId), to = cur.findIndex(x => x.id === m.id);
                    if (from < 0 || to < 0) return;
                    const [moved] = cur.splice(from, 1);
                    cur.splice(to, 0, moved);
                    dragMarkId = null;
                    writeMarks(cur);
                });
                b.addEventListener("dragend", () => { dragMarkId = null; });
                return b;
            }));
        }
        renderMarks();
        syncBookmarkBtn();
        addEventListener("storage", e => { if (e.key === MARKS_KEY) { renderMarks(); syncBookmarkBtn(); } });

        // ── Menu ───────────────────────────────────────────────────────────────
        // The top-bar menu button. Groups are separated by lines: pages, connection, quick toggles,
        // cloaking, clear data, about.
        const menuBtn = document.getElementById("menuBtn");
        let menuEl = null, menuToken = 0;

        function iconEl(name) {
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("class", "icon");
            svg.setAttribute("aria-hidden", "true");
            const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
            use.setAttribute("href", "#i-" + name);
            svg.append(use);
            return svg;
        }

        function closeMenu() {
            menuToken++;
            menuEl?.remove();
            menuEl = null;
            menuBtn.classList.remove("open");
        }

        function confirmBox(title, text, okLabel) {
            return new Promise(resolve => {
                const back = document.createElement("div");
                back.className = "modal-back";
                const box = document.createElement("div");
                box.className = "modal";
                box.innerHTML = `<h3></h3><p class="modal-text"></p><div class="actions"><button class="btn" data-x="cancel">Cancel</button><button class="btn primary" data-x="ok"></button></div>`;
                box.querySelector("h3").textContent = title;
                box.querySelector("p").textContent = text;
                box.querySelector('[data-x="ok"]').textContent = okLabel;
                const done = v => { back.remove(); removeEventListener("keydown", onKey, true); resolve(v); };
                const onKey = e => { if (e.key === "Escape") done(false); };
                addEventListener("keydown", onKey, true);
                box.querySelector('[data-x="cancel"]').onclick = () => done(false);
                box.querySelector('[data-x="ok"]').onclick = () => done(true);
                back.addEventListener("pointerdown", e => { if (e.target === back) done(false); });
                back.append(box);
                document.body.append(back);
                box.querySelector('[data-x="cancel"]').focus();
            });
        }

        const GAME_SAVES_KEY = "paroxysm:game-saves";

        async function reconnectNow() {
            const t = scramjet?.transport;
            if (!ready || typeof t?.reconnect !== "function") { showPill("warn", "Not connected yet.", 3000); return; }
            await t.reconnect(true);
        }

        async function clearProxyCookies() {
            try {
                scramjet.cookieJar.clear();
                await scramjet.persistCookies();
                await scramjet.propagateCookieSync([], { clear: true });
                showPill("ok", "Proxy cookies cleared. Reload open pages to see the change.", 5000);
            } catch (e) {
                console.error("[paroxysm] clearing proxy cookies failed:", e);
                showPill("error", "Couldn't clear the proxy cookies.", 5000);
            }
        }

        function openAbout() {
            openLocal(SETTINGS_URL);
            const t = getActiveTab();
            const show = () => {
                try {
                    const w = t.iframe.contentWindow;
                    if (w.document.readyState !== "complete" || !w.location.pathname.endsWith("settings.html")) return;
                    w.showSection?.("about");
                    t.iframe.removeEventListener("load", show);
                } catch {}
            };
            t.iframe.addEventListener("load", show);     // a newly opened Settings tab: wait until it has loaded
            show();                                      // an already open one
        }

        function menuGroups() {
            const s = paroxysmSettings.get();
            const light = s.theme === "light";
            const horizontal = document.body.classList.contains("layout-h");
            const marks = readMarks().length;
            const disguiseOn = !!s.tabCloak && s.tabCloak !== "off";
            const cloakLabel = id => paroxysmSettings.cloaks.find(c => c.id === id)?.label;
            const about = window.paroxysm.about();
            const hasSaves = (() => { try { return !!localStorage.getItem(GAME_SAVES_KEY); } catch { return false; } })();
            const clear = (title, text, ok, run) => async () => { if (await confirmBox(title, text, ok)) run(); };

            return [
                [   // 1. paroxysm pages
                    { icon: "plus", label: "New tab", run: () => createTab() },
                    { icon: "gamepad-2", label: "Games", run: () => openPage("games") },
                    { icon: "bot", label: "AI", run: () => openPage("ai") },
                    { icon: "settings", label: "Settings", run: () => openPage("settings") }
                ],
                [   // 2. connection
                    { info: "conn" },
                    { icon: "refresh-cw", label: "Reconnect", disabled: !ready, run: reconnectNow },
                    { icon: "zap", label: "Find best server", run: () => window.paroxysm.findBestServer() }
                ],
                [   // 3. quick toggles
                    { icon: light ? "moon" : "sun", label: light ? "Switch to dark theme" : "Switch to light theme", run: () => paroxysmSettings.set({ theme: light ? "dark" : "light" }) },
                    { icon: "bookmark", label: s.bookmarksBar === false ? "Show bookmarks bar" : "Hide bookmarks bar", hint: marks ? "" : "No bookmarks", disabled: !marks, run: () => paroxysmSettings.set({ bookmarksBar: s.bookmarksBar === false }) },
                    { icon: horizontal ? "panel-left" : "panel-top", label: horizontal ? "Use sidebar tabs" : "Use horizontal tabs", run: () => setLayout(horizontal ? "v" : "h") }
                ],
                [   // 4. cloaking
                    { icon: "eye-off", label: "Tab disguise", hint: disguiseOn ? "On, " + (cloakLabel(s.tabCloak) ?? "") : "Off",
                      run: () => paroxysmSettings.set(disguiseOn
                          ? { tabCloak: "off", tabCloakLast: s.tabCloak }
                          : { tabCloak: paroxysmSettings.cloaks.some(c => c.id === s.tabCloakLast && c.id !== "off") ? s.tabCloakLast : "docs" }) },
                    { icon: "siren", label: "Panic now", hint: s.panicKey ? "Key: " + s.panicKey : "", disabled: !paroxysmSettings.panicUrl(), run: () => paroxysmCloak.panic() }
                ],
                [   // 5. clear data
                    { icon: "trash-2", label: "Clear bookmarks", danger: true, disabled: !marks,
                      run: clear("Clear bookmarks?", "All your bookmarks will be removed. This can't be undone.", "Clear", () => writeMarks([])) },
                    { icon: "trash-2", label: "Clear game saves", danger: true, disabled: !hasSaves,
                      run: clear("Clear game saves?", "Saved progress of the games you played will be removed. Favorites and recent games are kept.", "Clear", () => { try { localStorage.removeItem(GAME_SAVES_KEY); } catch {} showPill("ok", "Game saves cleared.", 3500); }) },
                    { icon: "trash-2", label: "Clear proxy cookies", danger: true, disabled: !ready,
                      run: clear("Clear proxy cookies?", "You will be signed out of the websites you visited through paroxysm.", "Clear", clearProxyCookies) }
                ],
                [   // 6. about
                    { icon: "info", label: "About paroxysm", hint: "v" + about.version, run: openAbout },
                    { info: "about", text: `Scramjet ${about.scramjet}, controller ${about.controller}` }
                ]
            ];
        }

        // Status line of the connection group. Only the wisp server's reachability is probed, not the transport itself.
        async function fillConnection(row, token) {
            const dot = row.querySelector(".dot"), text = row.querySelector("span");
            const set = (kind, msg) => { if (token === menuToken) { dot.className = "dot " + kind; text.textContent = msg; } };
            const srv = WISP_SERVERS[activeServerIdx];
            if (!srv) return set("err", "No wisp server configured");
            if (!ready) return set("warn", srv.name + ": connecting…");
            if (scramjet?.transport?.__reconnect) return set("warn", srv.name + ": reconnecting…");
            set("warn", srv.name + ": checking…");
            const t0 = performance.now();
            try {
                await probeWithin(srv.url, 4000);
                set("ok", `${srv.name}: reachable (${Math.round(performance.now() - t0)} ms)`);
            } catch {
                set("err", srv.name + ": not reachable");
            }
        }

        function openMenu() {
            closeMenu();
            closeCtx();
            const token = menuToken;
            menuEl = document.createElement("div");
            menuEl.className = "menu";
            menuEl.setAttribute("role", "menu");
            menuGroups().forEach((group, i) => {
                if (i) { const sep = document.createElement("div"); sep.className = "menu-sep"; sep.setAttribute("role", "separator"); menuEl.append(sep); }
                group.forEach(it => {
                    if (it.info) {
                        const row = document.createElement("div");
                        row.className = "menu-info";
                        row.innerHTML = `<i class="dot"></i><span></span>`;
                        row.querySelector("span").textContent = it.text ?? "";
                        menuEl.append(row);
                        if (it.info === "conn") fillConnection(row, token);
                        else row.querySelector(".dot").style.display = "none";
                        return;
                    }
                    const b = document.createElement("button");
                    b.className = "menu-item" + (it.danger ? " danger" : "");
                    b.setAttribute("role", "menuitem");
                    b.disabled = !!it.disabled;
                    b.append(iconEl(it.icon));
                    const label = document.createElement("span");
                    label.textContent = it.label;
                    b.append(label);
                    if (it.hint) { const h = document.createElement("span"); h.className = "hint"; h.textContent = it.hint; b.append(h); }
                    b.addEventListener("click", () => { closeMenu(); it.run(); });
                    menuEl.append(b);
                });
            });
            document.body.append(menuEl);
            const r = menuBtn.getBoundingClientRect();
            menuEl.style.left = Math.max(8, Math.min(r.right - menuEl.offsetWidth, innerWidth - menuEl.offsetWidth - 8)) + "px";
            menuEl.style.top = (r.bottom + 6) + "px";
            menuBtn.classList.add("open");
        }

        menuBtn.addEventListener("click", () => menuEl ? closeMenu() : openMenu());
        addEventListener("pointerdown", e => { if (menuEl && !menuEl.contains(e.target) && !menuBtn.contains(e.target)) closeMenu(); }, true);
        addEventListener("blur", () => { if (menuEl) closeMenu(); });       // a click inside a page frame moves focus away
        addEventListener("resize", () => { if (menuEl) closeMenu(); });
        addEventListener("keydown", e => {
            if (!menuEl) return;
            if (e.key === "Escape") { closeMenu(); menuBtn.focus(); return; }
            if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
            e.preventDefault();
            const items = [...menuEl.querySelectorAll(".menu-item:not(:disabled)")];
            if (!items.length) return;
            const at = items.indexOf(document.activeElement);
            items[(at + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length].focus();
        });

        // One-time cleanup of the removed extension runtime (Sapphire, tried and removed 2026-11-19): its
        // stored extension files can be large. Safe to delete this block once nobody has the old version.
        try {
            if (!localStorage.getItem("paroxysm:sapphire-cleaned")) {
                localStorage.setItem("paroxysm:sapphire-cleaned", "1");
                localStorage.removeItem("paroxysm:builtin-extensions");
                indexedDB.deleteDatabase("sapphire_extensions");
            }
        } catch {}

        // ── New tab page messages ──────────────────────────────────────────────
        window.addEventListener("message", e => {
            if (e.data?.type === "newtab-navigate") go(e.data.url);

            // Messages from local pages (Games, ...). Only same-origin frames that are not proxied sites.
            const tab = tabs.find(t => t.iframe.contentWindow === e.source);
            if (!tab || tab.frame || e.origin !== location.origin) return;
            if (e.data?.type === "paroxysm-open" && typeof e.data.url === "string" && e.data.url.startsWith(LOCAL_SCHEME)) openLocal(e.data.url);   // open or focus a local page
            if (e.data?.type === "paroxysm-title" && typeof e.data.title === "string") updateTabTitle(tab, e.data.title.slice(0, 80));            // name this tab
        });

        // ── Service worker restarts ────────────────────────────────────────────
        // The browser stops an idle (or DevTools-stopped) worker. The restarted worker knows no tabs until the
        // controller sends its port again, which it does when the worker announces itself ($controller$swrevive).
        // Two gaps are closed here, from outside the controller: the controller ignores that announcement during
        // its first 5 s after start-up, and the request that woke the worker can't be routed yet, so its page
        // loads as the static server's 404. Pages that loaded like that are reloaded (twice at most).
        let lastRevive = -1e9;
        const recentlyRevived = () => performance.now() - lastRevive < 20000;
        const servedByProxy = win => { try { return typeof win.$scramjet !== "undefined"; } catch { return true; } };   // only proxied pages get $scramjet injected

        function reloadUnservedFrames() {
            tabs.forEach(t => {
                try {
                    const win = t.iframe.contentWindow;
                    if (t.frame && win.document.readyState === "complete" && !servedByProxy(win)) win.location.reload();
                } catch {}
            });
        }

        navigator.serviceWorker?.addEventListener("message", e => {
            if (!e.data?.$controller$swrevive || !ready) return;
            lastRevive = performance.now();
            if (scramjet.guardServiceWorkerRevive && typeof scramjet.setupMessagePort === "function") scramjet.setupMessagePort();
            setTimeout(reloadUnservedFrames, 1500);
        });

        // ── Init ───────────────────────────────────────────────────────────────
        function probeWisp(url) {
            return new Promise((resolve, reject) => {
                let ws;
                const timeout = setTimeout(() => {
                    try { ws && ws.close(); } catch {}
                    reject(new Error("Connection timed out"));
                }, 8000);
                try {
                    ws = new WebSocket(url);
                } catch (e) {
                    clearTimeout(timeout);
                    reject(e);
                    return;
                }
                ws.onopen = () => {
                    clearTimeout(timeout);
                    ws.close();
                    resolve();
                };
                ws.onerror = () => {
                    clearTimeout(timeout);
                    reject(new Error("WebSocket connection failed"));
                };
                ws.onclose = ev => {
                    // If close fires before open, it failed
                    if (ev.code !== 1000 && !ev.wasClean) {
                        clearTimeout(timeout);
                        reject(new Error(`Connection closed (code ${ev.code})`));
                    }
                };
            });
        }

        async function init() {
            try {
                setStatus("init", "Connecting");
                await navigator.serviceWorker.ready;

                const serviceworker =
                    navigator.serviceWorker.controller ??
                    (await navigator.serviceWorker.ready).active;

                const srv = WISP_SERVERS[activeServerIdx];
                setStatus("init", `Connecting to ${srv.name}…`);

                // Probe the Wisp server with a real WebSocket before trusting it
                let connected = false;
                while (!connected) {
                    try {
                        await probeWisp(srv.url);
                        connected = true;
                    } catch (e) {
                        setStatus("warn", "Not ready, wait...");
                        console.error("[paroxysm] wisp probe failed, retrying in 2s:", e);
                        await new Promise(r => setTimeout(r, 2000));
                    }
                }

                const transport = new EpoxyTransport({ wisp: srv.url });

                try {
                    await transport.init();
                } catch (e) {
                    setStatus("warn", "Transport failed");
                    console.error("[paroxysm] wisp transport failed:", e);
                    return;
                }

                scramjet = new Controller({
                    serviceworker,
                    transport,
                    scramjetConfig: defaultConfig
                });

                await scramjet.wait();
                ready = true;

                tabs.forEach(tab => {
                    if (!tab.frame && tab.url !== "newtab" && !tab.url.startsWith(LOCAL_SCHEME)) {
                        attachFrame(tab, tab.url);
                    }
                });

                setStatus("ready", "Ready");
            } catch (e) {
                console.error(e);
                setStatus("error", e.message);
            }
        }

        // ── Bootstrap ──────────────────────────────────────────────────────────
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js").then(() => {
                createTab();
                init();
            });
        } else {
            setStatus("error", "No service worker support");
        }
    </script>
</body>

</html>
