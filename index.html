    <link rel="icon" href="assets/paroxysm/paroxysm_darkmode_favicon.ico" sizes="any">
    <script src="paroxysm-settings.js"></script>
</head>

<body class="browser">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <header class="toolbar">
        <div class="toolbar-left">
            <button class="nav-btn" id="railToggle" title="Toggle sidebar"><svg class="icon" aria-hidden="true"><use href="#i-panel-left"/></svg></button>
            <button class="nav-btn" id="backBtn" title="Back"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg></button>
            <button class="nav-btn" id="forwardBtn" title="Forward"><svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
            <button class="nav-btn" id="reloadBtn" title="Reload"><svg class="icon" aria-hidden="true"><use href="#i-rotate-cw"/></svg></button>
        </div>

        <div class="url-bar">
            <span class="url-icon"><svg class="icon" aria-hidden="true"><use id="urlIconUse" href="#i-house"/></svg></span>
            <input type="text" id="urlInput" placeholder="Search or enter address"
                autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>

        <div class="toolbar-right">
            <button class="nav-btn" id="menuBtn" title="Menu" aria-label="Menu"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg></button>
        </div>
    </header>

    <aside class="rail">
        <div class="tab-bar" id="tabBar">
            <button class="new-tab-btn" id="newTabBtn" title="New tab">
                <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
                <span>New tab</span>
            </button>
        </div>
        <div class="rail-links" id="railLinks"></div>
        <div class="rail-resizer" id="railResizer" title="Drag to resize (double-click to reset)"></div>
    </aside>

    <div class="frames" id="frames"></div>

    <div class="pill" id="pill" role="status" aria-live="polite"></div>

    <script src="paroxysm.config.js"></script>
    <script src="paroxysm-cloak.js"></script>
    <script src="scramjet/scramjet.js"></script>
    <script src="controller/controller.api.js"></script>
    <script src="epoxy/index.js"></script>

    <script>
        const { Controller } = $scramjetController;
        const { defaultConfig } = $scramjet;
        const EpoxyTransport = self.EpoxyTransport.default;

        //── Wisp servers ───────────────────────────────────────────────────────
        // The built-in list lives in paroxysm.config.js, encoded (see encode_wisp.py), and is shown in
        // the UI as "Wisp Server 1", "Wisp Server 2", ... Servers the user adds in Settings > Proxy
        // are kept in the settings and shown as "Custom Server 1", ... Ordered fallback: the picked
        // server (if any) is tried first, then the rest in order. The UI never shows the URLs.
        const decodeWisp = s => { try { return atob(s).split("").reverse().join(""); } catch { return ""; } };
        const BUILTIN_WISP = (window.PAROXYSM_CONFIG?.wispServers ?? []).map(decodeWisp).filter(Boolean);
        const WISP_SERVERS = [];          // { id, name, url, custom }; init() reads WISP_SERVERS[activeServerIdx].url
        let activeServerIdx = 0;
        let activeServerId = null;

        function rebuildServers() {
            const custom = (paroxysmSettings.get().customWisp ?? []).filter(u => /^wss?:\/\/\S+$/i.test(u));
            WISP_SERVERS.length = 0;
            BUILTIN_WISP.forEach((url, i) => WISP_SERVERS.push({ id: "b" + i, name: "Wisp Server " + (i + 1), url, custom: false }));
            custom.forEach((url, i) => WISP_SERVERS.push({ id: "c" + i, name: "Custom Server " + (i + 1), url, custom: true }));
            const at = WISP_SERVERS.findIndex(x => x.id === activeServerId);
            if (at >= 0) activeServerIdx = at;
        }
        rebuildServers();

        const LOCAL_SCHEME     = "paroxysm://";
        // Local pages. "newtab" stays as an accepted alias for home.
        const LOCAL_ROUTES = {
            home:     { file: "newtab.html",   title: "Home",     icon: "house" },
            games:    { file: "games.html",    title: "Games",    icon: "gamepad-2" },
            music:    { file: "music.html",    title: "Music",    icon: "music" },
            ai:       { file: "ai.html",       title: "AI",       icon: "bot" },
            settings: { file: "settings.html", title: "Settings", icon: "settings" }
        };
        const HOME_URL         = LOCAL_SCHEME + "home";
        const SETTINGS_URL     = LOCAL_SCHEME + "settings";

        const tabBar        = document.getElementById("tabBar");
        const newTabBtn     = document.getElementById("newTabBtn");
        const framesEl      = document.getElementById("frames");
        const urlInput      = document.getElementById("urlInput");
        const urlIconUse    = document.getElementById("urlIconUse");
        const pillEl        = document.getElementById("pill");
        const railLinks     = document.getElementById("railLinks");

        let scramjet = null;
        let ready = false;

        // ── Notifications ──────────────────────────────────────────────────────
        // A small pill, shown only when there is something to report.
        // There is no permanent connection indicator.
        let pillTimer = null;

        function showPill(kind, message, ms = 3500) {
            clearTimeout(pillTimer);
            pillEl.className = "pill show " + kind;
            pillEl.textContent = message;
            if (ms) pillTimer = setTimeout(hidePill, ms);
        }

        function hidePill() {
            clearTimeout(pillTimer);
            pillEl.classList.remove("show");
        }

        // ── Status ─────────────────────────────────────────────────────────────
        // init() still reports through setStatus(); only problems are surfaced.
        const STATUS_TEXT = {
            "Not ready, wait...": "Can't reach a wisp server. Retrying…",
            "Transport failed":   "The network transport failed to start."
        };

        function setStatus(state, message) {
            if (state === "warn")       showPill("warn", STATUS_TEXT[message] ?? message, 0); // stays while retrying
            else if (state === "error") showPill("error", STATUS_TEXT[message] ?? message, 10000);
            else                        hidePill();                                          // connecting / ready
        }

        // ── Wisp server selection ──────────────────────────────────────────────
        // WISP_SERVERS is an ordered fallback list: the first endpoint that accepts a
        // connection wins. init() is not modified; it is wrapped below so the endpoint is
        // chosen before it runs, then init() probes and uses that endpoint exactly as before.
        const PROBE_CAP_MS = 5000;

        function probeWithin(url, ms) {
            return Promise.race([
                probeWisp(url),
                new Promise((_, reject) => setTimeout(() => reject(new Error("Timed out")), ms))
            ]);
        }

        // The order to try servers in: the picked one first (if any), then the rest in list order.
        function serverOrder(auto) {
            const all = WISP_SERVERS.map((_, i) => i);
            const pick = auto ? -1 : WISP_SERVERS.findIndex(x => x.id === paroxysmSettings.get().wispPreferred);
            return pick > 0 ? [pick, ...all.filter(i => i !== pick)] : all;
        }

        // Index of the first reachable server. Retries forever unless `once` is set (then -1).
        // `auto` ignores the picked server (used by "Find best server").
        async function findWispServer(once = false, auto = false) {
            if (!WISP_SERVERS.length) {
                setStatus("error", "No wisp servers are configured (see paroxysm.config.js).");
                return once ? -1 : new Promise(() => {});
            }
            while (true) {
                const order = serverOrder(auto);
                for (const i of order) {
                    try {
                        await probeWithin(WISP_SERVERS[i].url, PROBE_CAP_MS);
                        if (!auto && i !== order[0] && paroxysmSettings.get().wispPreferred) {
                            showPill("warn", `${WISP_SERVERS[order[0]].name} is unavailable. Using ${WISP_SERVERS[i].name}.`, 5000);
                        }
                        return i;
                    } catch (e) {
                        console.error(`[paroxysm] wisp server ${i + 1}/${WISP_SERVERS.length} unavailable:`, e);
                    }
                }
                if (once) return -1;
                setStatus("warn", "Not ready, wait...");
                await new Promise(r => setTimeout(r, 2000));
            }
        }

        const initWithServer = init;
        init = async function () {
            activeServerIdx = await findWispServer();
            activeServerId = WISP_SERVERS[activeServerIdx]?.id ?? null;
            return initWithServer();
        };

        // ── Settings API ───────────────────────────────────────────────────────
        // settings.html (same origin) reads and drives the proxy through this object.
        async function checkConnection() {
            const srv = WISP_SERVERS[activeServerIdx];
            if (!srv) { showPill("warn", "No wisp server is configured.", 4000); return false; }
            const t0 = performance.now();
            try {
                await probeWisp(srv.url);
                showPill("ok", `${srv.name} is reachable (${Math.round(performance.now() - t0)} ms)`);
                return true;
            } catch (e) {
                showPill("warn", `Can't reach ${srv.name}: ${e.message}`, 6000);
                return false;
            }
        }

        // Probe every endpoint at once and report each result.
        function testAll() {
            return Promise.all(WISP_SERVERS.map(async s => {
                const t0 = performance.now();
                try {
                    await probeWisp(s.url);
                    return { id: s.id, name: s.name, ok: true, ms: Math.round(performance.now() - t0) };
                } catch (e) {
                    return { id: s.id, name: s.name, ok: false, error: e.message };
                }
            }));
        }

        // Re-run the ordered search; switch only if a better (earlier) endpoint is available.
        async function findBestServer() {
            const idx = await findWispServer(true, true);
            if (idx === -1) { showPill("warn", "No wisp server responded.", 5000); return false; }
            paroxysmSettings.set({ wispPreferred: "" });          // back to automatic
            if (idx === activeServerIdx && ready) {
                showPill("ok", `Already on the best available server (${WISP_SERVERS[idx].name})`);
                return true;
            }
            scramjet = null;
            ready = false;
            init();
            return true;
        }

        // Use a server the user picked. It is checked first, so a dead one never leaves you offline.
        async function selectServer(i) {
            const srv = WISP_SERVERS[i];
            if (!srv) return false;
            if (i === activeServerIdx && ready) {
                paroxysmSettings.set({ wispPreferred: srv.id });
                showPill("ok", `Already using ${srv.name}`);
                return true;
            }
            try {
                await probeWithin(srv.url, PROBE_CAP_MS);
            } catch (e) {
                showPill("warn", `Can't reach ${srv.name}. Staying on the current server.`, 5000);
                return false;
            }
            paroxysmSettings.set({ wispPreferred: srv.id });
            scramjet = null;
            ready = false;
            init();
            return true;
        }

        // Servers the user adds (kept in settings; shown as "Custom Server N").
        function addCustomServer(input) {
            const url = String(input ?? "").trim();
            if (!/^wss?:\/\/\S+$/i.test(url)) return { ok: false, error: "That needs to start with wss:// (or ws://) and have no spaces." };
            if (WISP_SERVERS.some(x => x.url === url)) return { ok: false, error: "That server is already in the list." };
            paroxysmSettings.set({ customWisp: [...(paroxysmSettings.get().customWisp ?? []), url] });
            rebuildServers();
            return { ok: true };
        }

        function removeCustomServer(index) {
            const srv = WISP_SERVERS[index];
            if (!srv?.custom) return { ok: false, error: "Built-in servers can't be removed." };
            if (index === activeServerIdx && ready) return { ok: false, error: "That server is in use. Pick another one first." };
            const s = paroxysmSettings.get();
            paroxysmSettings.set({
                customWisp: (s.customWisp ?? []).filter(u => u !== srv.url),
                wispPreferred: s.wispPreferred === srv.id ? "" : s.wispPreferred
            });
            rebuildServers();
            return { ok: true };
        }

        window.paroxysm = {
            servers:     () => WISP_SERVERS.map(s => ({ id: s.id, name: s.name, custom: s.custom })),   // never the URLs
            activeIndex: () => activeServerIdx,
            isReady:     () => ready,
            checkConnection,
            testAll,
            findBestServer,
            selectServer,
            addCustomServer,
            removeCustomServer,
            about: () => ({
                version:    window.PAROXYSM_CONFIG?.version ?? "dev",
                scramjet:   self.$scramjet?.versionInfo?.version ?? "unknown",
                controller: self.$scramjetController?.VERSION ?? "unknown"
            })
        };

        // ── Helpers ────────────────────────────────────────────────────────────
        function norm(u) {
            if (!u) return "https://example.com";
            return u.startsWith("http") ? u : "https://" + u;
        }

        function isUrl(str) {
            return /^[^\s]+\.[^\s]+/.test(str) || str.startsWith("http");
        }

        function resolveInput(input) {
            if (!input.trim()) return null;
            if (isUrl(input)) return norm(input);
            return paroxysmSettings.searchUrl(input);
        }

        function getDomain(url) {
            try { return new URL(url).hostname; } catch { return null; }
        }

        function getFaviconUrl(url) {
            const domain = getDomain(url);
            if (!domain) return null;
            return `https://www.google.com/s2/favicons?domain=${domain}&sz=16`;
        }

        // Local pages (Settings, Games, ...) are real tabs: focus one if it is already open, otherwise open one.
        function openPage(key) {
            const url = LOCAL_SCHEME + key;
            const existing = tabs.find(t => t.url === url);
            if (existing) { switchTab(existing.id); return; }
            createTab();
            go(url);
        }

        // Sidebar links, in the order chosen in Settings > Appearance > Sidebar.
        function renderRailLinks() {
            railLinks.replaceChildren(...paroxysmSettings.sidebarOrder().map(key => {
                const r = LOCAL_ROUTES[key];
                const b = document.createElement("button");
                b.className = "rail-link";
                b.title = r.title;
                b.innerHTML = `<svg class="icon" aria-hidden="true"><use href="#i-${r.icon}"/></svg><span>${r.title}</span>`;
                b.addEventListener("click", () => openPage(key));
                return b;
            }));
        }

        // The proxied URL follows "<origin><controller prefix><id>/<frame id>/".
        // The prefix comes from the controller's own config instead of being hard-coded.
        function proxiedUrlPattern() {
            const prefix = $scramjetController.config?.prefix ?? "/~/sj/";
            const escaped = prefix.replace(/[.*+?^${}()|[\]\\\/]/g, "\\$&");
            return new RegExp("https?:\\/\\/[^/]+" + escaped + "[^/]+\\/[^/]+\\/(https?.+)");
        }

        // Lucide icon for a page: home and settings have their own, everything else a globe.
        // Used for the tab icon (until a site's favicon loads) and for the icon in the address bar.
        function routeKeyFor(url) {
            if (!url || url === "newtab") return "home";
            if (!url.startsWith(LOCAL_SCHEME)) return null;
            let page = url.slice(LOCAL_SCHEME.length).split("/")[0];
            if (page === "newtab") page = "home";
            return LOCAL_ROUTES[page] ? page : null;
        }

        function iconNameFor(url) {
            const key = routeKeyFor(url);
            return key ? LOCAL_ROUTES[key].icon : "globe";
        }

        function syncOmnibox(tab) {
            urlIconUse.setAttribute("href", "#i-" + iconNameFor(tab?.url));
        }

        function setTabIcon(tab, name) {
            if (!tab.tabEl) return;
            tab.tabEl.classList.add("local");
            tab.iconUse.setAttribute("href", "#i-" + name);
        }

        function getActiveTab() {
            return tabs.find(t => t.id === activeTabId) ?? null;
        }

        // ── Tab rendering ──────────────────────────────────────────────────────
        function renderTab(tab) {
            const el = document.createElement("div");
            el.className = "tab" + (tab.id === activeTabId ? " active" : "");
            el.dataset.id = tab.id;

            // Two icon slots: a site favicon (img) or a Lucide icon (svg). Home and settings, and
            // sites whose favicon lookup fails, show the Lucide icon; the paroxysm logo is never used.
            const favicon = document.createElement("img");
            favicon.className = "tab-favicon";
            favicon.alt = "";
            favicon.onerror = () => setTabIcon(tab, "globe");   // lookup blocked or failed

            const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            icon.setAttribute("class", "icon tab-icon");
            icon.setAttribute("aria-hidden", "true");
            const iconUse = document.createElementNS("http://www.w3.org/2000/svg", "use");
            icon.appendChild(iconUse);

            const title = document.createElement("span");
            title.className = "tab-title";
            title.textContent = tab.title || "Home";

            const closeBtn = document.createElement("span");
            closeBtn.className = "tab-close";
            closeBtn.innerHTML = `<svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>`;
            closeBtn.title = "Close tab";
            closeBtn.addEventListener("click", e => {
                e.stopPropagation();
                closeTab(tab.id);
            });

            el.appendChild(favicon);
            el.appendChild(icon);
            el.appendChild(title);
            el.appendChild(closeBtn);
            el.addEventListener("click", () => switchTab(tab.id));

            tab.tabEl = el;
            tab.faviconEl = favicon;
            tab.iconUse = iconUse;
            tabBar.insertBefore(el, newTabBtn);
            setTabIcon(tab, iconNameFor(tab.url));
        }

        function updateTabTitle(tab, title) {
            tab.title = title;
            if (tab.tabEl) tab.tabEl.querySelector(".tab-title").textContent = title;
        }

        function updateTabFavicon(tab, url) {
            if (!tab.faviconEl) return;
            const faviconUrl = getFaviconUrl(url);
            if (!faviconUrl) return;
            tab.tabEl?.classList.remove("local");
            tab.faviconEl.src = faviconUrl;
        }

        function syncTabBarActive() {
            tabs.forEach(t => t.tabEl?.classList.toggle("active", t.id === activeTabId));
        }

        // ── Tab lifecycle ──────────────────────────────────────────────────────
        const tabs = [];
        let activeTabId = null;
        let nextTabId   = 0;

        // Frames start hidden and fade in once they have loaded; they hide again as soon as the page
        // inside starts to unload (refresh, link click). That way the gap between two pages shows the
        // paroxysm colour instead of the browser's white. Nothing here touches the proxy engine.
        function watchFrame(tab) {
            const f = tab.iframe;
            let safety = 0;
            const show = () => { clearTimeout(safety); f.classList.add("shown"); };
            const hide = () => {
                f.classList.remove("shown");
                clearTimeout(safety);
                safety = setTimeout(show, 6000);          // never stay hidden if a load event is missed
            };
            f.addEventListener("load", () => {
                f.classList.toggle("web", !!tab.frame);   // proxied sites get a white canvas, local pages don't
                try { f.contentWindow.addEventListener("pagehide", hide); } catch {}
                try { paroxysmCloak.watchWindow(f.contentWindow, !!tab.frame); } catch {}   // panic key, character masking
                show();
            });
        }

        function createTab(url = null) {
            const id = nextTabId++;
            const iframe = document.createElement("iframe");
            iframe.title = "paroxysm";
            framesEl.appendChild(iframe);

            const tab = { id, iframe, frame: null, url: url || "newtab", title: "Home", tabEl: null, faviconEl: null, iconUse: null, _pollInterval: null };
            tabs.push(tab);
            watchFrame(tab);

            renderTab(tab);
            switchTab(id);

            if (url && ready) {
                attachFrame(tab, url);
            } else if (!url) {
                iframe.src = "newtab.html";
            }

            return tab;
        }

        function attachFrame(tab, url) {
            tab.frame = scramjet.createFrame(tab.iframe);
            tab.url = norm(url);
            tab.frame.go(tab.url);
            updateTabTitle(tab, tab.url);
            updateTabFavicon(tab, tab.url);

            if (tab._pollInterval) clearInterval(tab._pollInterval);
            tab._pollInterval = setInterval(() => {
                try {
                    const doc = tab.iframe.contentDocument;
                    const win = tab.iframe.contentWindow;
                    if (!doc || !win) return;

                    const raw = win.location.href;
                    if (raw && raw !== "about:blank") {
                        const match = raw.match(proxiedUrlPattern());
                        const realUrl = match ? decodeURIComponent(match[1].split("?")[0]) : raw;
                        if (realUrl !== tab.url) {
                            tab.url = realUrl;
                            updateTabFavicon(tab, realUrl);
                            if (tab.id === activeTabId) urlInput.value = realUrl;
                        }
                    }

                    const title = doc.title;
                    if (title && title !== "Just a moment..." && title !== tab.title) {
                        updateTabTitle(tab, title);
                    }
                } catch {}
            }, 500);
        }

        function switchTab(id) {
            activeTabId = id;
            tabs.forEach(t => t.iframe.classList.toggle("active", t.id === id));
            syncTabBarActive();
            const tab = getActiveTab();
            if (tab) {
                urlInput.value = tab.url === "newtab" ? HOME_URL : (tab.url || "");
                syncOmnibox(tab);
            }
        }

        function closeTab(id) {
            const idx = tabs.findIndex(t => t.id === id);
            if (idx === -1) return;
            const tab = tabs[idx];
            clearInterval(tab._pollInterval);
            tab.iframe.remove();
            tab.tabEl?.remove();
            tabs.splice(idx, 1);
            if (tabs.length === 0) { createTab(); return; }
            if (activeTabId === id) switchTab(tabs[Math.min(idx, tabs.length - 1)].id);
        }

        // ── Navigation ─────────────────────────────────────────────────────────
        function go(input) {
            const tab = getActiveTab();
            if (!tab) return;

            if (input.startsWith(LOCAL_SCHEME)) {
                const page = routeKeyFor(input);
                if (!page) return;
                const route = LOCAL_ROUTES[page];
                clearInterval(tab._pollInterval);
                tab._pollInterval = null;
                tab.frame = null;
                tab.url = LOCAL_SCHEME + page;
                urlInput.value = tab.url;
                updateTabTitle(tab, route.title);
                setTabIcon(tab, route.icon);
                syncOmnibox(tab);
                tab.iframe.src = route.file;
                return;
            }

            const url = resolveInput(input);
            if (!url) return;
            urlInput.value = url;
            tab.url = url;
            updateTabTitle(tab, url);
            updateTabFavicon(tab, url);
            syncOmnibox(tab);
            if (!tab.frame) {
                if (!ready) {
                    showPill("warn", "Still connecting. The page will load once a wisp server is ready.", 4000);
                    return;
                }
                attachFrame(tab, url);
            } else {
                tab.frame.go(url);
            }
        }

        urlInput.addEventListener("keydown", e => { if (e.key === "Enter") go(urlInput.value); });
        document.getElementById("backBtn").onclick    = () => getActiveTab()?.iframe?.contentWindow?.history.back();
        document.getElementById("forwardBtn").onclick = () => getActiveTab()?.iframe?.contentWindow?.history.forward();
        document.getElementById("reloadBtn").onclick  = () => getActiveTab()?.iframe?.contentWindow?.location.reload();
        newTabBtn.onclick = () => createTab();

        renderRailLinks();
        paroxysmCloak.init();
        paroxysmSettings.onChange(() => { renderRailLinks(); rebuildServers(); });

        // sidebar: collapse to icons (remembered)
        const RAIL_KEY = "paroxysm:rail-collapsed";
        function setRailCollapsed(on) {
            document.body.classList.toggle("rail-collapsed", on);
            try { localStorage.setItem(RAIL_KEY, on ? "1" : "0"); } catch {}
        }
        try { if (localStorage.getItem(RAIL_KEY) === "1") setRailCollapsed(true); } catch {}
        document.getElementById("railToggle").addEventListener("click",
            () => setRailCollapsed(!document.body.classList.contains("rail-collapsed")));

        // sidebar: drag the handle to resize (double-click resets), width is remembered
        const RAIL_W_KEY = "paroxysm:rail-width", RAIL_W_MIN = 160, RAIL_W_MAX = 360;
        function setRailWidth(px, save = true) {
            if (px == null) document.body.style.removeProperty("--rail-w");
            else document.body.style.setProperty("--rail-w", Math.min(RAIL_W_MAX, Math.max(RAIL_W_MIN, Math.round(px))) + "px");
            if (save) try { px == null ? localStorage.removeItem(RAIL_W_KEY) : localStorage.setItem(RAIL_W_KEY, String(Math.round(px))); } catch {}
        }
        try { const w = Number(localStorage.getItem(RAIL_W_KEY)); if (w) setRailWidth(w, false); } catch {}

        const resizer = document.getElementById("railResizer");
        let resizing = false, lastDown = 0;
        resizer.addEventListener("pointerdown", e => {
            const now = performance.now();
            if (now - lastDown < 350) { lastDown = 0; setRailWidth(null); return; }   // quick second press = reset
            lastDown = now;
            resizing = true;
            resizer.setPointerCapture(e.pointerId);
            document.body.classList.add("resizing");
        });
        resizer.addEventListener("pointermove", e => { if (resizing) setRailWidth(e.clientX, false); });
        const endResize = e => {
            if (!resizing) return;
            resizing = false;
            document.body.classList.remove("resizing");
            const w = parseInt(getComputedStyle(document.body).getPropertyValue("--rail"), 10);
            if (w) setRailWidth(w);
        };
        resizer.addEventListener("pointerup", endResize);
        resizer.addEventListener("pointercancel", endResize);

        // ── New tab page messages ──────────────────────────────────────────────
        window.addEventListener("message", e => {
            if (e.data?.type === "newtab-navigate") go(e.data.url);
        });

        // ── Init ───────────────────────────────────────────────────────────────
        function probeWisp(url) {
            return new Promise((resolve, reject) => {
                let ws;
                const timeout = setTimeout(() => {
                    try { ws && ws.close(); } catch {}
                    reject(new Error("Connection timed out"));
                }, 8000);
                try {
                    ws = new WebSocket(url);
                } catch (e) {
                    clearTimeout(timeout);
                    reject(e);
                    return;
                }
                ws.onopen = () => {
                    clearTimeout(timeout);
                    ws.close();
                    resolve();
                };
                ws.onerror = () => {
                    clearTimeout(timeout);
                    reject(new Error("WebSocket connection failed"));
                };
                ws.onclose = ev => {
                    // If close fires before open, it failed
                    if (ev.code !== 1000 && !ev.wasClean) {
                        clearTimeout(timeout);
                        reject(new Error(`Connection closed (code ${ev.code})`));
                    }
                };
            });
        }

        async function init() {
            try {
                setStatus("init", "Connecting");
                await navigator.serviceWorker.ready;

                const serviceworker =
                    navigator.serviceWorker.controller ??
                    (await navigator.serviceWorker.ready).active;

                const srv = WISP_SERVERS[activeServerIdx];
                setStatus("init", `Connecting to ${srv.name}…`);

                // Probe the Wisp server with a real WebSocket before trusting it
                let connected = false;
                while (!connected) {
                    try {
                        await probeWisp(srv.url);
                        connected = true;
                    } catch (e) {
                        setStatus("warn", "Not ready, wait...");
                        console.error("[paroxysm] wisp probe failed, retrying in 2s:", e);
                        await new Promise(r => setTimeout(r, 2000));
                    }
                }

                const transport = new EpoxyTransport({ wisp: srv.url });

                try {
                    await transport.init();
                } catch (e) {
                    setStatus("warn", "Transport failed");
                    console.error("[paroxysm] wisp transport failed:", e);
                    return;
                }

                scramjet = new Controller({
                    serviceworker,
                    transport,
                    scramjetConfig: defaultConfig
                });

                await scramjet.wait();
                ready = true;

                tabs.forEach(tab => {
                    if (!tab.frame && tab.url !== "newtab" && !tab.url.startsWith(LOCAL_SCHEME)) {
                        attachFrame(tab, tab.url);
                    }
                });

                setStatus("ready", "Ready");
            } catch (e) {
                console.error(e);
                setStatus("error", e.message);
            }
        }

        // ── Bootstrap ──────────────────────────────────────────────────────────
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js").then(() => {
                createTab();
                init();
            });
        } else {
            setStatus("error", "No service worker support");
        }
    </script>
</body>

</html>
