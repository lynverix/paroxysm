<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>paroxysm</title>
    <link rel="preload" href="fonts/inter-tight-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="paroxysm.css">
    <link rel="icon" href="assets/paroxysm/paroxysm_darkmode_favicon.ico" sizes="any">
    <script src="paroxysm-settings.js"></script>
</head>

<body class="browser">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
        <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
        <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
        <symbol id="i-rotate-cw" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></symbol>
        <symbol id="i-settings" viewBox="0 0 24 24"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
        <symbol id="i-panel-left" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></symbol>
    </svg>

    <header class="toolbar">
        <div class="toolbar-left">
            <button class="nav-btn" id="railToggle" title="Toggle sidebar"><svg class="icon" aria-hidden="true"><use href="#i-panel-left"/></svg></button>
            <button class="nav-btn" id="backBtn" title="Back"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg></button>
            <button class="nav-btn" id="forwardBtn" title="Forward"><svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
            <button class="nav-btn" id="reloadBtn" title="Reload"><svg class="icon" aria-hidden="true"><use href="#i-rotate-cw"/></svg></button>
        </div>

        <div class="url-bar">
            <input type="text" id="urlInput" placeholder="Search or enter address"
                autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            <button class="go-btn" id="goBtn" title="Go"><svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
        </div>

        <div class="toolbar-right"></div>
    </header>

    <aside class="rail">
        <div class="tab-bar" id="tabBar">
            <button class="new-tab-btn" id="newTabBtn" title="New tab">
                <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
                <span>New tab</span>
            </button>
        </div>
        <button class="rail-link" id="browserSettingsBtn" title="Settings">
            <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>
            <span>Settings</span>
        </button>
        <div class="rail-resizer" id="railResizer" title="Drag to resize (double-click to reset)"></div>
    </aside>

    <div class="frames" id="frames"></div>

    <div class="pill" id="pill" role="status" aria-live="polite"></div>

    <script src="paroxysm.config.js"></script>
    <script src="scramjet/scramjet.js"></script>
    <script src="controller/controller.api.js"></script>
    <script src="epoxy/index.js"></script>

    <script>
        const { Controller } = $scramjetController;
        const { defaultConfig } = $scramjet;
        const EpoxyTransport = self.EpoxyTransport.default;

        //── Wisp servers (edit them in paroxysm.config.js) ─────────────────────
        // Ordered fallback list from paroxysm.config.js; the first endpoint that responds is used.
        const WISP_SERVERS = (window.PAROXYSM_CONFIG?.wispServers ?? []).map(url => {
            let name = url;
            try { name = new URL(url).host; } catch {}
            return { name, url };
        });
        let activeServerIdx = 0;

        const LOCAL_SCHEME     = "paroxysm://";
        const LOCAL_PAGES      = ["newtab", "settings"];
        const SETTINGS_URL     = LOCAL_SCHEME + "settings";
        const DEFAULT_FAVICON  = "assets/paroxysm/paroxysm_darkmode_icon.png";
        // Settings tab icon: Lucide's "settings" gear, built in code (no image file needed)
        const SETTINGS_FAVICON = "data:image/svg+xml," + encodeURIComponent(
            `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f4f4f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>`);

        const tabBar        = document.getElementById("tabBar");
        const newTabBtn     = document.getElementById("newTabBtn");
        const framesEl      = document.getElementById("frames");
        const urlInput      = document.getElementById("urlInput");
        const pillEl        = document.getElementById("pill");
        const settingsBtn   = document.getElementById("browserSettingsBtn");

        let scramjet = null;
        let ready = false;

        // ── Notifications ──────────────────────────────────────────────────────
        // A small pill, shown only when there is something to report.
        // There is no permanent connection indicator.
        let pillTimer = null;

        function showPill(kind, message, ms = 3500) {
            clearTimeout(pillTimer);
            pillEl.className = "pill show " + kind;
            pillEl.textContent = message;
            if (ms) pillTimer = setTimeout(hidePill, ms);
        }

        function hidePill() {
            clearTimeout(pillTimer);
            pillEl.classList.remove("show");
        }

        // ── Status ─────────────────────────────────────────────────────────────
        // init() still reports through setStatus(); only problems are surfaced.
        const STATUS_TEXT = {
            "Not ready, wait...": "Can't reach a wisp server. Retrying…",
            "Transport failed":   "The network transport failed to start."
        };

        function setStatus(state, message) {
            if (state === "warn")       showPill("warn", STATUS_TEXT[message] ?? message, 0); // stays while retrying
            else if (state === "error") showPill("error", STATUS_TEXT[message] ?? message, 10000);
            else                        hidePill();                                          // connecting / ready
        }

        // ── Wisp server selection ──────────────────────────────────────────────
        // WISP_SERVERS is an ordered fallback list: the first endpoint that accepts a
        // connection wins. init() is not modified; it is wrapped below so the endpoint is
        // chosen before it runs, then init() probes and uses that endpoint exactly as before.
        const PROBE_CAP_MS = 5000;

        function probeWithin(url, ms) {
            return Promise.race([
                probeWisp(url),
                new Promise((_, reject) => setTimeout(() => reject(new Error("Timed out")), ms))
            ]);
        }

        // Index of the first reachable endpoint. Retries forever unless `once` is set (then -1).
        async function findWispServer(once = false) {
            if (!WISP_SERVERS.length) {
                setStatus("error", "No wisp servers are configured (see paroxysm.config.js).");
                return once ? -1 : new Promise(() => {});
            }
            while (true) {
                for (let i = 0; i < WISP_SERVERS.length; i++) {
                    try {
                        await probeWithin(WISP_SERVERS[i].url, PROBE_CAP_MS);
                        return i;
                    } catch (e) {
                        console.error(`[paroxysm] wisp endpoint ${i + 1}/${WISP_SERVERS.length} unavailable:`, e);
                    }
                }
                if (once) return -1;
                setStatus("warn", "Not ready, wait...");
                await new Promise(r => setTimeout(r, 2000));
            }
        }

        const initWithServer = init;
        init = async function () {
            activeServerIdx = await findWispServer();
            return initWithServer();
        };

        // ── Settings API ───────────────────────────────────────────────────────
        // settings.html (same origin) reads and drives the proxy through this object.
        async function checkConnection() {
            const srv = WISP_SERVERS[activeServerIdx];
            if (!srv) { showPill("warn", "No wisp server is configured.", 4000); return false; }
            const t0 = performance.now();
            try {
                await probeWisp(srv.url);
                showPill("ok", `${srv.name} is reachable (${Math.round(performance.now() - t0)} ms)`);
                return true;
            } catch (e) {
                showPill("warn", `Can't reach ${srv.name}: ${e.message}`, 6000);
                return false;
            }
        }

        // Probe every endpoint at once and report each result.
        function testAll() {
            return Promise.all(WISP_SERVERS.map(async s => {
                const t0 = performance.now();
                try {
                    await probeWisp(s.url);
                    return { name: s.name, url: s.url, ok: true, ms: Math.round(performance.now() - t0) };
                } catch (e) {
                    return { name: s.name, url: s.url, ok: false, error: e.message };
                }
            }));
        }

        // Re-run the ordered search; switch only if a better (earlier) endpoint is available.
        async function findBestServer() {
            const idx = await findWispServer(true);
            if (idx === -1) { showPill("warn", "No wisp server responded.", 5000); return false; }
            if (idx === activeServerIdx && ready) {
                showPill("ok", `Already on the best available server (${WISP_SERVERS[idx].name})`);
                return true;
            }
            scramjet = null;
            ready = false;
            init();
            return true;
        }

        window.paroxysm = {
            servers:     () => WISP_SERVERS.map(s => ({ name: s.name, url: s.url })),
            activeIndex: () => activeServerIdx,
            isReady:     () => ready,
            checkConnection,
            testAll,
            findBestServer,
            about: () => ({
                version:    window.PAROXYSM_CONFIG?.version ?? "dev",
                scramjet:   self.$scramjet?.versionInfo?.version ?? "unknown",
                controller: self.$scramjetController?.VERSION ?? "unknown"
            })
        };

        // ── Helpers ────────────────────────────────────────────────────────────
        function norm(u) {
            if (!u) return "https://example.com";
            return u.startsWith("http") ? u : "https://" + u;
        }

        function isUrl(str) {
            return /^[^\s]+\.[^\s]+/.test(str) || str.startsWith("http");
        }

        function resolveInput(input) {
            if (!input.trim()) return null;
            if (isUrl(input)) return norm(input);
            return paroxysmSettings.searchUrl(input);
        }

        function getDomain(url) {
            try { return new URL(url).hostname; } catch { return null; }
        }

        function getFaviconUrl(url) {
            const domain = getDomain(url);
            if (!domain) return null;
            return `https://www.google.com/s2/favicons?domain=${domain}&sz=16`;
        }

        // Settings is a real tab: focus it if it is already open, otherwise open one.
        function openSettings() {
            const existing = tabs.find(t => t.url === SETTINGS_URL);
            if (existing) { switchTab(existing.id); return; }
            createTab();
            go(SETTINGS_URL);
        }

        // The proxied URL follows "<origin><controller prefix><id>/<frame id>/".
        // The prefix comes from the controller's own config instead of being hard-coded.
        function proxiedUrlPattern() {
            const prefix = $scramjetController.config?.prefix ?? "/~/sj/";
            const escaped = prefix.replace(/[.*+?^${}()|[\]\\\/]/g, "\\$&");
            return new RegExp("https?:\\/\\/[^/]+" + escaped + "[^/]+\\/[^/]+\\/(https?.+)");
        }

        function getActiveTab() {
            return tabs.find(t => t.id === activeTabId) ?? null;
        }

        // ── Tab rendering ──────────────────────────────────────────────────────
        function renderTab(tab) {
            const el = document.createElement("div");
            el.className = "tab" + (tab.id === activeTabId ? " active" : "");
            el.dataset.id = tab.id;

            const favicon = document.createElement("img");
            favicon.className = "tab-favicon";
            favicon.src = DEFAULT_FAVICON;
            favicon.alt = "";
            favicon.onerror = () => { favicon.onerror = null; favicon.src = DEFAULT_FAVICON; }; // lookup blocked or failed

            const title = document.createElement("span");
            title.className = "tab-title";
            title.textContent = tab.title || "New tab";

            const closeBtn = document.createElement("span");
            closeBtn.className = "tab-close";
            closeBtn.innerHTML = `<svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>`;
            closeBtn.title = "Close tab";
            closeBtn.addEventListener("click", e => {
                e.stopPropagation();
                closeTab(tab.id);
            });

            el.appendChild(favicon);
            el.appendChild(title);
            el.appendChild(closeBtn);
            el.addEventListener("click", () => switchTab(tab.id));

            tab.tabEl = el;
            tab.faviconEl = favicon;
            tabBar.insertBefore(el, newTabBtn);
        }

        function updateTabTitle(tab, title) {
            tab.title = title;
            if (tab.tabEl) tab.tabEl.querySelector(".tab-title").textContent = title;
        }

        function updateTabFavicon(tab, url) {
            if (!tab.faviconEl) return;
            const faviconUrl = getFaviconUrl(url);
            if (faviconUrl) tab.faviconEl.src = faviconUrl;
        }

        function syncTabBarActive() {
            tabs.forEach(t => t.tabEl?.classList.toggle("active", t.id === activeTabId));
        }

        // ── Tab lifecycle ──────────────────────────────────────────────────────
        const tabs = [];
        let activeTabId = null;
        let nextTabId   = 0;

        function createTab(url = null) {
            const id = nextTabId++;
            const iframe = document.createElement("iframe");
            iframe.title = "paroxysm";
            framesEl.appendChild(iframe);

            const tab = { id, iframe, frame: null, url: url || "newtab", title: "New tab", tabEl: null, faviconEl: null, _pollInterval: null };
            tabs.push(tab);

            renderTab(tab);
            switchTab(id);

            if (url && ready) {
                attachFrame(tab, url);
            } else if (!url) {
                iframe.src = "newtab.html";
            }

            return tab;
        }

        function attachFrame(tab, url) {
            tab.frame = scramjet.createFrame(tab.iframe);
            tab.url = norm(url);
            tab.frame.go(tab.url);
            updateTabTitle(tab, tab.url);
            updateTabFavicon(tab, tab.url);

            if (tab._pollInterval) clearInterval(tab._pollInterval);
            tab._pollInterval = setInterval(() => {
                try {
                    const doc = tab.iframe.contentDocument;
                    const win = tab.iframe.contentWindow;
                    if (!doc || !win) return;

                    const raw = win.location.href;
                    if (raw && raw !== "about:blank") {
                        const match = raw.match(proxiedUrlPattern());
                        const realUrl = match ? decodeURIComponent(match[1].split("?")[0]) : raw;
                        if (realUrl !== tab.url) {
                            tab.url = realUrl;
                            updateTabFavicon(tab, realUrl);
                            if (tab.id === activeTabId) urlInput.value = realUrl;
                        }
                    }

                    const title = doc.title;
                    if (title && title !== "Just a moment..." && title !== tab.title) {
                        updateTabTitle(tab, title);
                    }
                } catch {}
            }, 500);
        }

        function switchTab(id) {
            activeTabId = id;
            tabs.forEach(t => t.iframe.classList.toggle("active", t.id === id));
            syncTabBarActive();
            const tab = getActiveTab();
            if (tab) {
                urlInput.value = tab.url === "newtab" ? "" : tab.url.startsWith(LOCAL_SCHEME) ? tab.url : (tab.url || "");
            }
        }

        function closeTab(id) {
            const idx = tabs.findIndex(t => t.id === id);
            if (idx === -1) return;
            const tab = tabs[idx];
            clearInterval(tab._pollInterval);
            tab.iframe.remove();
            tab.tabEl?.remove();
            tabs.splice(idx, 1);
            if (tabs.length === 0) { createTab(); return; }
            if (activeTabId === id) switchTab(tabs[Math.min(idx, tabs.length - 1)].id);
        }

        // ── Navigation ─────────────────────────────────────────────────────────
        function go(input) {
            const tab = getActiveTab();
            if (!tab) return;

            if (input.startsWith(LOCAL_SCHEME)) {
                const page = input.slice(LOCAL_SCHEME.length).split("/")[0];
                if (!LOCAL_PAGES.includes(page)) return;
                clearInterval(tab._pollInterval);
                tab._pollInterval = null;
                tab.frame = null;
                urlInput.value = input;
                tab.url = input;
                updateTabTitle(tab, page === "settings" ? "Settings" : "New tab");
                tab.faviconEl.src = page === "settings" ? SETTINGS_FAVICON : DEFAULT_FAVICON;
                tab.iframe.src = `${page}.html`;
                return;
            }

            const url = resolveInput(input);
            if (!url) return;
            urlInput.value = url;
            tab.url = url;
            updateTabTitle(tab, url);
            updateTabFavicon(tab, url);
            if (!tab.frame) {
                if (!ready) {
                    showPill("warn", "Still connecting. The page will load once a wisp server is ready.", 4000);
                    return;
                }
                attachFrame(tab, url);
            } else {
                tab.frame.go(url);
            }
        }

        document.getElementById("goBtn").onclick = () => go(urlInput.value);
        urlInput.addEventListener("keydown", e => { if (e.key === "Enter") go(urlInput.value); });
        document.getElementById("backBtn").onclick    = () => getActiveTab()?.iframe?.contentWindow?.history.back();
        document.getElementById("forwardBtn").onclick = () => getActiveTab()?.iframe?.contentWindow?.history.forward();
        document.getElementById("reloadBtn").onclick  = () => getActiveTab()?.iframe?.contentWindow?.location.reload();
        newTabBtn.onclick = () => createTab();

        settingsBtn.addEventListener("click", openSettings);

        // sidebar: collapse to icons (remembered)
        const RAIL_KEY = "paroxysm:rail-collapsed";
        function setRailCollapsed(on) {
            document.body.classList.toggle("rail-collapsed", on);
            try { localStorage.setItem(RAIL_KEY, on ? "1" : "0"); } catch {}
        }
        try { if (localStorage.getItem(RAIL_KEY) === "1") setRailCollapsed(true); } catch {}
        document.getElementById("railToggle").addEventListener("click",
            () => setRailCollapsed(!document.body.classList.contains("rail-collapsed")));

        // sidebar: drag the handle to resize (double-click resets), width is remembered
        const RAIL_W_KEY = "paroxysm:rail-width", RAIL_W_MIN = 160, RAIL_W_MAX = 360;
        function setRailWidth(px, save = true) {
            if (px == null) document.body.style.removeProperty("--rail-w");
            else document.body.style.setProperty("--rail-w", Math.min(RAIL_W_MAX, Math.max(RAIL_W_MIN, Math.round(px))) + "px");
            if (save) try { px == null ? localStorage.removeItem(RAIL_W_KEY) : localStorage.setItem(RAIL_W_KEY, String(Math.round(px))); } catch {}
        }
        try { const w = Number(localStorage.getItem(RAIL_W_KEY)); if (w) setRailWidth(w, false); } catch {}

        const resizer = document.getElementById("railResizer");
        let resizing = false, lastDown = 0;
        resizer.addEventListener("pointerdown", e => {
            const now = performance.now();
            if (now - lastDown < 350) { lastDown = 0; setRailWidth(null); return; }   // quick second press = reset
            lastDown = now;
            resizing = true;
            resizer.setPointerCapture(e.pointerId);
            document.body.classList.add("resizing");
        });
        resizer.addEventListener("pointermove", e => { if (resizing) setRailWidth(e.clientX, false); });
        const endResize = e => {
            if (!resizing) return;
            resizing = false;
            document.body.classList.remove("resizing");
            const w = parseInt(getComputedStyle(document.body).getPropertyValue("--rail"), 10);
            if (w) setRailWidth(w);
        };
        resizer.addEventListener("pointerup", endResize);
        resizer.addEventListener("pointercancel", endResize);

        // ── New tab page messages ──────────────────────────────────────────────
        window.addEventListener("message", e => {
            if (e.data?.type === "newtab-navigate") go(e.data.url);
        });

        // ── Init ───────────────────────────────────────────────────────────────
        function probeWisp(url) {
            return new Promise((resolve, reject) => {
                let ws;
                const timeout = setTimeout(() => {
                    try { ws && ws.close(); } catch {}
                    reject(new Error("Connection timed out"));
                }, 8000);
                try {
                    ws = new WebSocket(url);
                } catch (e) {
                    clearTimeout(timeout);
                    reject(e);
                    return;
                }
                ws.onopen = () => {
                    clearTimeout(timeout);
                    ws.close();
                    resolve();
                };
                ws.onerror = () => {
                    clearTimeout(timeout);
                    reject(new Error("WebSocket connection failed"));
                };
                ws.onclose = ev => {
                    // If close fires before open, it failed
                    if (ev.code !== 1000 && !ev.wasClean) {
                        clearTimeout(timeout);
                        reject(new Error(`Connection closed (code ${ev.code})`));
                    }
                };
            });
        }

        async function init() {
            try {
                setStatus("init", "Connecting");
                await navigator.serviceWorker.ready;

                const serviceworker =
                    navigator.serviceWorker.controller ??
                    (await navigator.serviceWorker.ready).active;

                const srv = WISP_SERVERS[activeServerIdx];
                setStatus("init", `Connecting to ${srv.name}…`);

                // Probe the Wisp server with a real WebSocket before trusting it
                let connected = false;
                while (!connected) {
                    try {
                        await probeWisp(srv.url);
                        connected = true;
                    } catch (e) {
                        setStatus("warn", "Not ready, wait...");
                        console.error("[paroxysm] wisp probe failed, retrying in 2s:", e);
                        await new Promise(r => setTimeout(r, 2000));
                    }
                }

                const transport = new EpoxyTransport({ wisp: srv.url });

                try {
                    await transport.init();
                } catch (e) {
                    setStatus("warn", "Transport failed");
                    console.error("[paroxysm] wisp transport failed:", e);
                    return;
                }

                scramjet = new Controller({
                    serviceworker,
                    transport,
                    scramjetConfig: defaultConfig
                });

                await scramjet.wait();
                ready = true;

                tabs.forEach(tab => {
                    if (!tab.frame && tab.url !== "newtab" && !tab.url.startsWith(LOCAL_SCHEME)) {
                        attachFrame(tab, tab.url);
                    }
                });

                setStatus("ready", "Ready");
            } catch (e) {
                console.error(e);
                setStatus("error", e.message);
            }
        }

        // ── Bootstrap ──────────────────────────────────────────────────────────
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js").then(() => {
                createTab();
                init();
            });
        } else {
            setStatus("error", "No service worker support");
        }
    </script>
</body>

</html>
